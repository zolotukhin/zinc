      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      button,
      a,
      select,
      summary,
      textarea {
        touch-action: manipulation;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      ::selection {
        background: #72543b;
        color: #fff;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .app-header {
        flex-shrink: 0;
        padding: 20px 32px 0;
      }
      .header-inner {
        display: flex;
        align-items: center;
        gap: 18px;
        max-width: 1440px;
        margin: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
      }
      .brand-mark {
        display: block;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }
      .brand-mark,
      .welcome-mark,
      .msg.a .av {
        background-image: var(--zinc-logo);
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
      }
      .brand h1 {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 2px;
      }
      .brand-caption {
        font-size: 12px;
        color: var(--muted);
        padding-left: 18px;
        border-left: 1px solid var(--border);
      }
      .header-spacer {
        flex: 1;
      }
      .badge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .badge::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #858b87;
      }
      .badge.ok::before,
      .local-dot {
        background: #99b6a0;
      }
      .btn-clear {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #d7dad5;
        background: transparent;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 12px;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn-clear svg {
        width: 15px;
        height: 15px;
      }
      .btn-clear:hover {
        background: var(--bg3);
        border-color: #555a55;
      }
      .btn-clear:disabled {
        opacity: 0.35;
      }
      .model-bar {
        max-width: 1440px;
        margin: 20px auto 0;
        padding: 13px 0;
        border-top: 1px solid #272929;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .model-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }
      .model-label {
        color: var(--muted);
        font-size: 11px;
      }
      .model-select {
        min-width: 150px;
        max-width: 310px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
        padding: 8px 25px 8px 8px;
        cursor: pointer;
        text-overflow: ellipsis;
      }
      .model-select:hover {
        background: var(--bg2);
        border-color: var(--border);
      }
      .model-select:disabled {
        opacity: 0.65;
        cursor: default;
      }
      .model-action {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        padding: 5px 10px;
        font-size: 11px;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .model-action:hover {
        background: var(--bg3);
        border-color: #686356;
      }
      .model-action.download {
        color: var(--accent);
        border-color: #68513c;
      }
      .model-action.active {
        color: #a6b9aa;
        border-color: #36453a;
      }
      .model-action:disabled:not(.active) {
        opacity: 0.45;
      }
      .runtime-details {
        position: relative;
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .runtime-details summary {
        cursor: pointer;
        list-style: none;
        padding: 8px;
        border-radius: 6px;
      }
      .runtime-details summary::-webkit-details-marker {
        display: none;
      }
      .runtime-details summary:hover {
        color: var(--text);
        background: var(--bg2);
      }
      .runtime-popover {
        position: absolute;
        right: 0;
        top: 38px;
        z-index: 5;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #202222;
        box-shadow: 0 12px 36px #0005;
        width: min(340px, 85vw);
        display: grid;
        gap: 12px;
        line-height: 1.6;
      }
      .model-tag {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--text);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .model-tag:hover {
        color: var(--accent);
      }
      .model-icon,
      .model-icon svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .stats {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .top-status {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 0 auto;
        max-width: var(--chat-width);
        padding: 0 24px;
        width: 100%;
      }
      #dl:not(:empty) {
        padding: 8px 0;
        color: var(--accent);
      }
      .model-progress {
        flex: 1 1 160px;
        height: 4px;
        background: var(--bg3);
        border-radius: 5px;
        overflow: hidden;
      }
      .model-progress-fill {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s;
      }
      .model-progress.indeterminate .model-progress-fill {
        width: 35%;
        animation: slide 1.3s linear infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(320%);
        }
      }
      #ui-notice:not(:empty) {
        margin: 8px auto;
        width: min(var(--chat-width), calc(100% - 40px));
        border: 1px solid #68513c;
        padding: 10px 14px;
        border-radius: 9px;
        background: #282219;
        font-size: 13px;
        color: #edc39e;
      }
      .workspace {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
      }
      #messages {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 28px 28px 38px;
        scrollbar-width: thin;
        scrollbar-color: #3a3e39 transparent;
      }
      .empty {
        max-width: 800px;
        margin: clamp(30px, 9vh, 120px) auto 0;
        text-align: center;
        animation: enter 0.28s ease-out;
      }
      .welcome-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 29px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        font-weight: 550;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .empty h2 {
        font-size: clamp(28px, 4vw, 38px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -1.3px;
        color: #edede8;
      }
      .welcome-sub {
        font-size: 14px;
        color: var(--muted);
        margin-top: 16px;
        line-height: 1.7;
      }
      .starters {
        margin: 40px auto 24px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-width: 650px;
        text-align: left;
      }
      .starter {
        position: relative;
        text-align: left;
        display: grid;
        gap: 7px;
        padding: 18px;
        color: var(--text);

          ><span id="model-hint" class="model-hint" role="status"></span>
        </div>
        <details class="runtime-details">
          <summary>Engine details <span aria-hidden="true">⌄</span></summary>
          <div class="runtime-popover">
            <a
              id="mn"
              class="model-tag"
              href="https://huggingface.co/"
              target="_blank"
              rel="noopener noreferrer"
              >Loading model…</a
            ><span id="gpu" class="stats"></span
            ><span id="mtp-status" class="stats">Checking MTP support…</span
            ><span id="mtp-last-status" class="stats" aria-live="polite"></span
            ><button id="mtp-reset" class="model-action" type="button" hidden>
              Use engine default for MTP</button
            ><span>Powered by ZINC Inference Engine</span>
          </div>
        </details>
      </div>
    </header>
    <div id="ui-notice" role="status" aria-live="polite"></div>
    <div class="top-status">
      <span id="dl" class="stats" role="status"></span>
      <div id="mp" class="model-progress" hidden>
        <div id="mpf" class="model-progress-fill"></div>
      </div>
    </div>
    <main class="workspace" aria-label="ZINC chat">
      <div id="messages" tabindex="0" aria-label="Conversation">
        <div class="empty" id="w">
          <div class="welcome-mark" aria-hidden="true"></div>
          <p class="eyebrow">Your space to think</p>
          <h2>Getting things ready</h2>
          <p class="welcome-sub">Connecting to your ZINC engine…</p>
        </div>
      </div>
      <button id="jump-latest" type="button" hidden aria-label="Jump to latest message">
        ↓ Back to latest
      </button>
    </main>
    <footer id="ia">
      <div class="composer">
        <label class="sr-only" for="i">Message ZINC</label>
        <textarea
          id="i"
          placeholder="Ask anything, or start with an idea…"
          rows="1"
          enterkeyhint="send"
          spellcheck="true"
        ></textarea>
        <div class="composer-tools">
          <div class="composer-options">
            <label id="tw" class="thinking-toggle" title="Enable model reasoning when supported"
              ><input id="th" type="checkbox" /><span id="tl">Thinking</span></label
            ><label
              id="mtp-control"
              class="thinking-toggle disabled"
              title="Checking model-native multi-token prediction support"
              ><input id="mtp" type="checkbox" disabled /><span id="mtp-label"
                >MTP status unreported</span
              ></label
            >
          </div>
          <div class="composer-right">
            <span class="composer-key" aria-hidden="true">↵ to send</span
            ><button
              id="b"
              type="button"
              onclick="send()"
              title="Send message"
              aria-label="Send message"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M12 19V5m-6 6 6-6 6 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-footer">
        <span class="hint" id="hint">Enter to send · Shift+Enter for a new line</span
        ><span id="stats" class="stats"></span>
      </div>
      <span id="composer-status" class="sr-only" role="status" aria-live="polite"></span>
    </footer>
    <script>
      const M = document.getElementById('messages'),
        I = document.getElementById('i'),
        B = document.getElementById('b'),
        CB = document.getElementById('cb');
      const ST = document.getElementById('st'),
        MN = document.getElementById('mn'),
        SS = document.getElementById('stats'),
        MS = document.getElementById('ms');
      const MB = document.getElementById('mbtn'),
        GM = document.getElementById('gpu'),
        DL = document.getElementById('dl'),
        MP = document.getElementById('mp'),
        MPF = document.getElementById('mpf');
      const TW = document.getElementById('tw'),
        TH = document.getElementById('th'),
        TL = document.getElementById('tl');
      const readyEmptyHtml =
        '<div class="empty" id="w">\n<div class="welcome-mark" aria-hidden="true"></div>\n<p class="eyebrow">A little space for big ideas</p>\n<h2>What’s on your mind?</h2>\n<p class="welcome-sub">Think it through. Make something. Find a new perspective.</p>\n<div class="starters" aria-label="Conversation starters">\n<button class="starter" type="button" data-prompt="Help me brainstorm a few creative ideas for a project. Ask me what I have in mind first."><span class="starter-icon" aria-hidden="true">✧</span><strong>Explore an idea</strong><span>Find a fresh direction</span><span class="starter-arrow" aria-hidden="true">↗</span></button>\n<button class="starter" type="button" data-prompt="Help me understand a complicated topic in simple terms. Ask me what I want to learn."><span class="starter-icon" aria-hidden="true">◎</span><strong>Make it clear</strong><span>Break down the complex</span><span class="starter-arrow" aria-hidden="true">↗</span></button>\n<button class="starter" type="button" data-prompt="Help me write or improve some code. Ask me what I am building."><span class="starter-icon code-icon" aria-hidden="true">&lt;/&gt;</span><strong>Build something</strong><span>A second pair of eyes</span><span class="starter-arrow" aria-hidden="true">↗</span></button>\n</div>\n<p class="welcome-foot"><span class="local-dot"></span> Local inference. Open possibilities.</p>\n</div>';

      const ICON_QWEN =
        '<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M174.82 108.75L155.38 75L165.64 57.75C166.46 56.31 166.46 54.53 165.64 53.09L155.38 35.84C154.86 34.91 153.87 34.33 152.78 34.33H114.88L106.14 19.03C105.62 18.1 104.63 17.52 103.54 17.52H83.3C82.21 17.52 81.22 18.1 80.7 19.03L61.26 52.77H41.02C39.93 52.77 38.94 53.35 38.42 54.28L28.16 71.53C27.34 72.97 27.34 74.75 28.16 76.19L45.52 107.5L36.78 122.8C35.96 124.24 35.96 126.02 36.78 127.46L47.04 144.71C47.56 145.64 48.55 146.22 49.64 146.22H87.54L96.28 161.52C96.8 162.45 97.79 163.03 98.88 163.03H119.12C120.21 163.03 121.2 162.45 121.72 161.52L141.16 127.78H158.52C159.61 127.78 160.6 127.2 161.12 126.27L171.38 109.02C172.2 107.58 172.2 105.8 171.38 104.36L174.82 108.75Z" fill="url(#qic0)"/><path d="M119.12 163.03H98.88L87.54 144.71H49.64L61.26 126.39H80.7L38.42 55.29H61.26L83.3 19.03L93.56 37.35L83.3 55.29H161.58L151.32 72.54L170.76 106.28H151.32L141.16 88.34L101.18 163.03H119.12Z" fill="white"/><path d="M127.86 79.83H76.14L101.18 122.11L127.86 79.83Z" fill="url(#qic1)"/><defs><radialGradient id="qic0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) rotate(90) scale(100)"><stop stop-color="#665CEE"/><stop offset="1" stop-color="#332E91"/></radialGradient><radialGradient id="qic1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) rotate(90) scale(100)"><stop stop-color="#665CEE"/><stop offset="1" stop-color="#332E91"/></radialGradient></defs></svg>';
      const ICON_GOOGLE =
        '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09a6.97 6.97 0 0 1 0-4.17V7.07H2.18A11.97 11.97 0 0 0 0 12c0 1.94.46 3.77 1.28 5.4l3.56-2.77.01-.54z" fill="#FBBC05"/><path d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.09 14.97 0 12 0 7.7 0 3.99 2.47 2.18 6.07l3.66 2.84c.87-2.6 3.3-4.16 6.16-4.16z" fill="#EA4335"/></svg>';
      const ICON_DEFAULT =
        '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#1a1a40"/><rect x="30" y="35" width="40" height="30" rx="6" stroke="#a78bfa" stroke-width="5" fill="none"/><circle cx="50" cy="50" r="6" fill="#a78bfa"/></svg>';

      function modelFamilyFromName(name) {
        const f = (name || '').toLowerCase();
        if (f.includes('qwen')) return 'qwen';
        if (f.includes('gemma')) return 'google';
        return 'default';
      }
      function modelFamilyIcon(family) {
        const f = modelFamilyFromName(family);
        if (f === 'qwen') return ICON_QWEN;
        if (f === 'google') return ICON_GOOGLE;
        return ICON_DEFAULT;
      }

      let modelsReady = false,
        modelActionPending = false,
        modelConnectionFailed = false;
      let modelCapabilities = {},
        modelActionKind = '',
        modelStateVersion = 0;
      function setModelCapabilities(info) {
        for (const key of [
          'supports_model_management',
          'supports_model_unload',
          'supports_model_pull',
        ]) {
          if (typeof info?.[key] === 'boolean') modelCapabilities[key] = info[key];
        }
        if (typeof info?.supports_model_management !== 'boolean') {
          const switching = info?.capabilities?.model_switching;
          const management = info?.capabilities?.model_management;
          if (typeof switching === 'boolean')
            modelCapabilities.supports_model_management = switching;
          else if (typeof management === 'boolean')
            modelCapabilities.supports_model_management = management;
        }
      }
      function modelCanLoad(model) {
        return (
          !!model &&
          model.can_activate !== false &&
          model.supported_on_current_gpu !== false &&
          model.fits_current_gpu !== false &&
          (modelCapabilities.supports_model_management === true ||
            (modelCapabilities.supports_model_management !== false && model.managed))
        );
      }
      function modelCanPull(model) {
        return (
          modelCanLoad(model) && model.managed && modelCapabilities.supports_model_pull !== false
        );
      }
      function modelCanUnload() {
        return modelCapabilities.supports_model_unload === true && !!activeModel();
      }
      function updateModelSelect() {
        MS.disabled =
          isGenerating ||
          modelActionPending ||
          models.length <= 1 ||
          modelCapabilities.supports_model_management === false;
        let reason =
          modelCapabilities.supports_model_management === false
            ? 'Model switching needs a server update'
            : modelsReady && models.length <= 1
              ? 'Only one model is available'
              : '';
        MS.title =
          reason ||
          (isGenerating
            ? 'Wait for the current reply to finish'
            : modelActionPending
              ? modelActionKind
              : 'Choose a model');
        const hint = document.getElementById('model-hint');
        if (hint) {
          hint.textContent = reason;
          hint.hidden = !reason;
        }
      }
      function showUiNotice(message, isError) {
        let notice = document.getElementById('ui-notice');
        if (!notice) return;
        notice.textContent = message || '';
        notice.hidden = !message;
        notice.classList.toggle('error', !!isError);
      }

      async function performModelAction(model) {
        if (!model || modelActionPending || isGenerating || hasActiveDownload()) return;
        if (model.active || !(model.installed ? modelCanLoad(model) : modelCanPull(model))) return;
        modelActionPending = true;
        modelStateVersion++;
        modelActionKind = model.installed ? 'Loading model…' : 'Starting download…';
        MS.disabled = true;
        CB.disabled = true;
        showUiNotice('');
        updateModelAction();
        updateComposerState();
        updateThinkingUi();
        updateMtpUi();
        SS.textContent = model.installed ? 'Loading model…' : 'Starting download…';
        try {
          let response = await fetch(
            base + (model.installed ? '/models/activate' : '/models/pull'),
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ model: model.id }),
            },
          );
          if (!response.ok) {
            let error = await response.json().catch(() => ({}));
            throw new Error(error.error?.message || response.statusText || 'Please try again.');
          }
          modelStateVersion++;
          if (!(await refreshModels())) {
            SS.textContent = 'Waiting for model status';
            return;
          }
          if (model.installed && activeModel()?.id === model.id) {
            resetConversation();
            SS.textContent = 'Model ready';
            I.focus();
          } else if (model.installed) {
            SS.textContent = 'Model was not activated';
            showUiNotice('The selected model is not loaded. Choose it and try again.', true);
          } else SS.textContent = 'Download started';
        } catch (error) {
          modelStateVersion++;
          await refreshModels();
          SS.textContent = 'Model action failed';
          showUiNotice(
            (model.installed ? 'Could not load model. ' : 'Could not start download. ') +
              (error.message || String(error)),
            true,
          );
        } finally {
          modelActionPending = false;
          modelActionKind = '';
          updateModelSelect();
          CB.disabled = isGenerating;
          updateModelAction();
          updateComposerState();
          updateThinkingUi();
          updateMtpUi();
          updateEmptyState();
        }
      }

      function modelQualityHint(model) {
        // Supported inference does not establish chat quality. Missing metadata
        // from an older server is unknown, rather than a negative recommendation.
        return model.recommended_for_chat === false ? ' \u00b7 Chat not recommended' : '';
      }

      async function unloadModel() {
        const model = activeModel();
        if (
          !model ||
          !modelCanUnload() ||
          modelActionPending ||
          isGenerating ||
          hasActiveDownload()
        )
          return;
        modelActionPending = true;
        modelActionKind = 'Unloading model…';
        modelStateVersion++;
        showUiNotice('');
        setGenerating(false);
        SS.textContent = modelActionKind;
        try {
          const response = await fetch(base + '/models/unload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: model.id }),
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error?.message || response.statusText || 'Please try again.');
          }
          modelStateVersion++;
          // The server confirmed eviction. Keep conversation/draft available while
          // preventing another send from silently loading the evicted model.
          models = models.map((item) => ({ ...item, active: false }));
          runtimeMtpCapability = null;
          setCurrentModel(null);
          await refreshModels();
          SS.textContent = 'Model unloaded · files kept';
        } catch (error) {
          modelStateVersion++;
          await refreshModels();
          SS.textContent = 'Could not unload model';
          showUiNotice('Could not unload model. ' + (error.message || String(error)), true);
        } finally {
          modelActionPending = false;
          modelActionKind = '';
          setGenerating(false);
          updateEmptyState();
        }
      }

      function renderModelPicker() {
        let available = models.filter((m) => modelCanLoad(m) && (m.installed || modelCanPull(m)));
        let heading = modelsReady ? 'Choose your model' : 'Connecting to ZINC';
        let subtitle = modelsReady
          ? 'Your next idea starts here. Pick a model to get going.'
          : 'Your local workspace will be ready in a moment.';
        let html =
          '<div class="model-picker" id="w"><h2>' +
          heading +
          '</h2><div class="picker-sub">' +
          subtitle +
          '</div><div class="model-grid">';
        for (let m of available) {
          let badge = '',
            badgeClass = 'download',
            clickable = !modelActionPending && !hasActiveDownload();
          if (m.active) {
            badge = 'Ready';
            badgeClass = 'active';
            clickable = false;
          } else if (m.downloading) {
            badge = 'Downloading…';
            badgeClass = 'downloading';
            clickable = false;
          } else if (m.download_phase === 'verifying') {
            badge = 'Verifying…';
            badgeClass = 'downloading';
            clickable = false;
          } else if (m.fits_current_gpu === false) {
            badge = 'Needs more GPU memory';
            badgeClass = 'too-large';
            clickable = false;
          } else if (m.installed) {
            badge = 'Load model';
            badgeClass = 'installed';
          } else {
            badge = 'Download · ' + (m.size_bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
            badgeClass = 'download';
          }
          let vram = (m.required_vram_bytes / (1024 * 1024 * 1024)).toFixed(0);
          let cardClass =
            'model-card' + (m.active ? ' active-card' : '') + (clickable ? '' : ' disabled');
          html +=
            '<button type="button" class="' +
            cardClass +
            '" data-model-id="' +
            esc(m.id).replace(/"/g, '&quot;') +
            '"' +
            (clickable ? '' : ' disabled') +
            '>';
          html +=
            '<span class="card-icon" aria-hidden="true">' +
            modelFamilyIcon(m.family || m.display_name) +
            '</span>';
          html +=
            '<span class="card-body"><span class="card-name">' +
            esc(m.display_name || m.id) +
            '</span>';
          html +=
            '<span class="card-detail">' +
            esc(m.quantization || m.format || '') +
            ' · ' +
            vram +
            ' GB GPU memory' +
            (m.thinking_stable ? ' · Reasoning' : '') +
            esc(modelQualityHint(m)) +
            '</span>';
          html +=
            '<span class="card-badge ' + badgeClass + '">' + badge + '</span></span></button>';
        }
        if (modelsReady && !available.length)
          html += '<p class="picker-sub">No compatible models are available for this device.</p>';
        html += '</div></div>';
        if (renderModelPicker.lastHtml === html && M.querySelector('.model-picker')) return;
        M.innerHTML = html;
        renderModelPicker.lastHtml = html;
        M.querySelectorAll('.model-card:not(.disabled)').forEach((card) => {
          card.addEventListener('click', () => {
            let model = models.find((m) => m.id === card.getAttribute('data-model-id'));
            if (model && !model.active) performModelAction(model);
          });
        });
      }

      function updateEmptyState() {
        if (H.length > 0) return;
        let active = activeModel();
        if (active && active.active) {
          if (!M.querySelector('#w.empty .starters')) M.innerHTML = readyEmptyHtml;
        } else renderModelPicker();
      }
      const chatStateKey = 'zinc.chat.state.v3';
      const chatPrefsKey = 'zinc.chat.prefs.v1';
      let H = [],
        base = location.origin + '/v1',
        activeController = null,
        isGenerating = false,
        stopRequested = false,
        models = [],
        modelPollTimer = null,
        healthPollTimer = null;
      let chatSessionId = '',
        userScrolledUp = false;
      M.addEventListener(
        'scroll',
        function () {
          let nearBottom = M.scrollHeight - M.scrollTop - M.clientHeight < 80;
          userScrolledUp = !nearBottom;
          updateJumpButton();
        },
        { passive: true },
      );
      function updateJumpButton() {
        let jump = document.getElementById('jump-latest');
        if (jump) jump.hidden = !userScrolledUp || !H.length;
      }
      function autoScroll() {
        if (!userScrolledUp) M.scrollTop = M.scrollHeight;
        updateJumpButton();
      }
      let renderTimer = null,
        pendingRender = null,
        renderUsesFrame = false;
      function scheduleRender(fn) {
        pendingRender = fn;
        if (renderTimer !== null) return;
        const render = function () {
          renderTimer = null;
          let f = pendingRender;
          pendingRender = null;
          if (f) f();
        };
        renderUsesFrame = typeof requestAnimationFrame === 'function';
        renderTimer = renderUsesFrame ? requestAnimationFrame(render) : setTimeout(render, 16);
      }
      function flushPendingRender() {
        if (renderTimer !== null) {
          if (renderUsesFrame) cancelAnimationFrame(renderTimer);
          else clearTimeout(renderTimer);
          renderTimer = null;
        }
        if (pendingRender) {
          let f = pendingRender;
          pendingRender = null;
          f();
        }
      }

      function newChatSessionId() {
        try {
          if (window.crypto && typeof window.crypto.randomUUID === 'function')
            return window.crypto.randomUUID();
        } catch (e) {}
        return 'chat-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }

      function readStorage(key) {
        try {
          return localStorage && typeof localStorage.getItem === 'function'
            ? localStorage.getItem(key)
            : null;
        } catch (e) {
          return null;
        }
      }

      function writeStorage(key, value) {
        try {
          if (localStorage && typeof localStorage.setItem === 'function')
            localStorage.setItem(key, value);
        } catch (e) {}
      }

      function removeStorage(key) {
        try {
          if (localStorage && typeof localStorage.removeItem === 'function')
            localStorage.removeItem(key);
        } catch (e) {}
      }

      function sanitizeMessage(msg) {
        if (!msg || typeof msg !== 'object') return null;
        if (msg.role !== 'user' && msg.role !== 'assistant') return null;
        const content = typeof msg.content === 'string' ? msg.content : '';
        const raw = typeof msg.raw === 'string' ? msg.raw : '';
        const transport = typeof msg.transport === 'string' ? msg.transport : '';
        const partial = msg.partial === true;
        const incomplete = msg.incomplete === true;
        const noticeKind =
          msg.notice_kind === 'error' ? 'error' : msg.notice_kind === 'warn' ? 'warn' : '';
        const noticeTitle = typeof msg.notice_title === 'string' ? msg.notice_title : '';
        const noticeMessage = typeof msg.notice_message === 'string' ? msg.notice_message : '';
        if (!content && !raw) return null;
        let cleaned = { role: msg.role, content, transport };
        if (raw) cleaned.raw = raw;
        if (partial) cleaned.partial = true;
        if (incomplete) cleaned.incomplete = true;
        if (noticeKind) cleaned.notice_kind = noticeKind;
        if (noticeTitle) cleaned.notice_title = noticeTitle;
        if (noticeMessage) cleaned.notice_message = noticeMessage;
        const mtp = normalizeMtpResult(msg.mtp);
        if (msg.role === 'assistant' && mtp) cleaned.mtp = mtp;
        if (msg.role === 'assistant' && typeof msg.reasoning_open === 'boolean')
          cleaned.reasoning_open = msg.reasoning_open;
        return cleaned;
      }

      function readChatState() {
        let raw = readStorage(chatStateKey);
        if (!raw) return { messages: [], input: '', sessionId: newChatSessionId() };
        try {
          let parsed = JSON.parse(raw);
          let messages = Array.isArray(parsed.messages)
            ? parsed.messages
                .map(sanitizeMessage)
                .filter(Boolean)
                .filter((m) => !(m.role === 'assistant' && m.partial))
                .slice(-128)
            : [];
          let input = typeof parsed.input === 'string' ? parsed.input.slice(0, 8000) : '';
          let sessionId =
            typeof parsed.sessionId === 'string' && parsed.sessionId
              ? parsed.sessionId
              : newChatSessionId();
          return { messages, input, sessionId };
        } catch (e) {
          return { messages: [], input: '', sessionId: newChatSessionId() };
        }
      }

      function readChatPrefs() {
        const defaults = { thinkingEnabled: true, mtpPreference: 'auto' };
        const raw = readStorage(chatPrefsKey);
        if (!raw) return defaults;
        try {
          const parsed = JSON.parse(raw);
          // The old false default did not represent an explicit user choice.
          const mtpPreference = ['auto', 'on', 'off'].includes(parsed.mtpPreference)
            ? parsed.mtpPreference
            : parsed.mtpEnabled === true
              ? 'on'
              : 'auto';
          return { thinkingEnabled: parsed.thinkingEnabled !== false, mtpPreference };
        } catch (e) {
          return defaults;
        }
      }

      let chatPrefs = readChatPrefs();

      function saveChatPrefs() {
        writeStorage(
          chatPrefsKey,
          JSON.stringify({
            thinkingEnabled: chatPrefs.thinkingEnabled !== false,
            mtpPreference: chatPrefs.mtpPreference,
          }),
        );
      }

      let chatSaveTimer = null;
      function scheduleChatStateSave(delay = 300) {
        if (chatSaveTimer !== null) return;
        chatSaveTimer = setTimeout(() => {
          chatSaveTimer = null;
          saveChatState();
        }, delay);
      }
      function saveChatState() {
        if (chatSaveTimer !== null) {
          clearTimeout(chatSaveTimer);
          chatSaveTimer = null;
        }
        writeStorage(
          chatStateKey,
          JSON.stringify({
            messages: H.slice(-128),
            input: (I.value || '').slice(0, 8000),
            sessionId: chatSessionId || newChatSessionId(),
          }),
        );
      }

      function showEmptyState() {
        updateEmptyState();
      }

      function switchableModels() {
        return models.filter(
          (m) => m.managed && m.installed && m.supported_on_current_gpu && m.fits_current_gpu,
        );
      }

      function fmtGiB(bytes) {
        return (bytes / (1024 * 1024 * 1024)).toFixed(2);
      }

      function selectedModel() {
        return (
          models.find((m) => m.id === MS.value) || models.find((m) => m.active) || models[0] || null
        );
      }

      function activeModel() {
        return models.find((m) => m.active) || null;
      }

      function activeModelSupportsThinking() {
        let m = activeModel();
        return !!(m && m.supports_thinking_toggle);
      }

      function hasActiveDownload() {
        return models.some((m) => m.downloading || m.download_phase === 'verifying');
      }

      function currentDownloadModel() {
        return (
          models.find(
            (m) =>
              m.downloading || m.download_phase === 'verifying' || m.download_phase === 'failed',
          ) || null
        );
      }

      function scheduleModelRefresh(delay) {
        clearTimeout(modelPollTimer);
        modelPollTimer = setTimeout(() => refreshModels().catch(() => {}), delay);
      }

      function stopModelRefresh() {
        clearTimeout(modelPollTimer);
        modelPollTimer = null;
      }

      function scheduleHealthRefresh(delay) {
        clearTimeout(healthPollTimer);
        healthPollTimer = setTimeout(() => refreshHealth().catch(() => {}), delay);
      }

      function modelHrefForName(name) {
        const n = (name || '').toLowerCase();
        if (n.includes('qwen3.5') || n.includes('qwen35-9b'))
          return 'https://huggingface.co/unsloth/Qwen3.5-9B-GGUF';
        if (n.includes('qwen3.6-35b') || n.includes('qwen3.6-35b-a3b'))
          return 'https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF';
        if (n.includes('qwen3-30b-a3b')) return 'https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF';
        if (n.includes('qwen2.5-32b') || n.includes('qwen2-32b'))
          return 'https://huggingface.co/unsloth/Qwen2.5-32B-Instruct-GGUF';
        return 'https://huggingface.co/';
      }

      function setModelTag(name) {
        const label = name && name.trim() ? name : 'No model loaded';
        const fam = modelFamilyFromName(label);
        const icon =
          fam !== 'default' ? '<span class="model-icon">' + modelFamilyIcon(label) + '</span>' : '';
        const html = icon + esc(label);
        if (MN.innerHTML !== html) MN.innerHTML = html;
        MN.href = modelHrefForName(label);
      }

      function resetConversation(note) {
        H = [];
        const mtpStatus = document.getElementById('mtp-last-status');
        if (mtpStatus) mtpStatus.textContent = '';
        chatSessionId = newChatSessionId();
        saveChatState();
        showEmptyState();
        if (note) addMsg('assistant', note);
      }

      function requestMessagesFromHistory(supportsThinking) {
        return H.filter((m) => !(m.role === 'assistant' && (m.partial || m.incomplete))).map(
          (m) => {
            if (m.role !== 'assistant') return { role: m.role, content: m.content };
            let answer = typeof m.content === 'string' ? m.content : '';
            let raw = typeof m.raw === 'string' ? m.raw : '';
            let transport = historyTransportContent(
              answer,
              raw,
              activeModelSupportsThinking() && TH.checked,
              !!supportsThinking,
            );
            return { role: m.role, content: transport || m.transport || answer };
          },
        );
      }

      const historyAnswerCharLimit = 640;

      function compactHistoryAnswer(answer) {
        let text = (answer || '').trim();
        if (text.length <= historyAnswerCharLimit) return text;
        let end = historyAnswerCharLimit;
        let floor = Math.floor(historyAnswerCharLimit * 0.6);
        for (let i = historyAnswerCharLimit; i > floor; i--) {
          let ch = text[i - 1];
          if (ch === '\n' || ch === '.' || ch === '!' || ch === '?' || ch === ' ') {
            end = i;
            break;
          }
        }
        return text.slice(0, end).trim();
      }

      function historyTransportContent(answer, raw, enableThinking, supportsThinking) {
        let compact = compactHistoryAnswer(answer);
        if (!compact) return '';
        if (!supportsThinking) return compact;
        return '<think>\n\n</think>\n\n' + compact;
      }

      function chatMaxTokens(enableThinking) {
        return enableThinking ? 16384 : 2048;
      }

      function assistantHtmlFromRaw(raw, isThinking) {
        let view = normalizeDisplayView(splitDisplayContent(raw, isThinking));
        let html = '';
        if (view.showReasoning)
          html += renderReasoning(view.reasoning, view.isThinking, view.collapsedReasoning);
        if (view.answer) html += md(view.answer);
        if (
          !html &&
          raw &&
          !view.suppressedReasoning &&
          !view.collapsedReasoning &&
          !view.promotedReasoning
        )
          html = md(stripTrailingArtifacts(raw));
        return { html, view };
      }

      function assistantLiveHtmlFromRaw(raw, isThinking) {
        const view = splitDisplayContent(raw, isThinking);
        let html = '';
        if (view.showReasoning)
          html += renderLiveReasoning(view.reasoning, view.isThinking, view.collapsedReasoning);
        if (view.answer) html += renderLiveText(view.answer);
        if (!html && raw) html = renderLiveText(raw);
        return { html, view };
      }

      const liveAssistantNodes = new WeakMap();
      const liveMarkdownNodes = new WeakMap();

      // Seal complete blocks while keeping a small, formatted tail live. Lists,
      // tables, and quotes remain together until the next block is unambiguous.
      function markdownCommitBoundary(source) {
        let offset = 0,
          safe = 0,
          kind = '',
          fence = '',
          gap = false;
        while (true) {
          const newline = source.indexOf('\n', offset);
          if (newline === -1) break;
          const line = source.slice(offset, newline).replace(/\r$/, '');
          const end = newline + 1;
          const marker = line.match(/^ {0,3}(`{3,}|~{3,})/);
          if (fence) {
            if (
              marker &&
              marker[1][0] === fence[0] &&
              marker[1].length >= fence.length &&
              line.slice(marker[0].length).trim() === ''
            ) {
              fence = '';
              kind = '';
              safe = end;
            }
            offset = end;
            continue;
          }
          if (!line.trim()) {
            gap = true;
            offset = end;
            continue;
          }
          if (kind === 'table' && !gap && line.includes('|')) {
            offset = end;
            continue;
          }
          const indented = /^(?: {2,}|\t)\S/.test(line);
          const heading = /^ {0,3}#{1,6}\s+\S/.test(line);
          const rule = /^ {0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})$/.test(line);
          const tableSeparator =
            line.includes('|') && /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
          const nextKind = /^\s*(?:[-+*]|\d+[.)])\s+/.test(line)
            ? 'list'
            : /^ {0,3}>(?: |$)/.test(line)
              ? 'quote'
              : 'paragraph';
          if (gap) {
            const continues =
              (kind === 'list' && (nextKind === 'list' || indented)) ||
              (kind === 'quote' && nextKind === 'quote');
            if (!continues) {
              safe = offset;
              kind = '';
            }
          } else if (
            kind &&
            (marker ||
              heading ||
              rule ||
              (nextKind === 'list' && kind !== 'list') ||
              (nextKind === 'quote' && kind !== 'quote') ||
              (kind === 'table' && !line.includes('|')))
          ) {
            safe = offset;
            kind = '';
          }
          gap = false;
          if (marker) {
            fence = marker[1];
            kind = 'code';
          } else if (heading || rule) {
            safe = end;
            kind = '';
          } else if (tableSeparator) {
            kind = 'table';
          } else if (!kind) {
            kind = nextKind;
          }
          offset = end;
        }
        return safe;
      }

      function updateStreamMarkdown(element, text) {
        let state = liveMarkdownNodes.get(element);
        if (!state || !text.startsWith(state.prefix)) {
          element.textContent = '';
          const tail = document.createElement('div');
          tail.className = 'markdown-tail';
          element.appendChild(tail);
          state = { prefix: '', tail, tailHtml: '' };
          liveMarkdownNodes.set(element, state);
        }
        const remaining = text.slice(state.prefix.length);
        const boundary = markdownCommitBoundary(remaining);
        if (boundary) {
          const source = remaining.slice(0, boundary);
          const block = document.createElement('div');
          block.className = 'markdown-committed';
          block.innerHTML = md(source);
          element.insertBefore(block, state.tail);
          highlightAll(block);
          state.prefix += source;
        }
        const html = md(remaining.slice(boundary));
        if (html !== state.tailHtml) {
          state.tail.innerHTML = html;
          state.tailHtml = html;
        }
      }

      function updateLiveAssistant(bbl, raw, isThinking, cursor) {
        const view = splitDisplayContent(raw, isThinking);
        let nodes = liveAssistantNodes.get(bbl);
        if (!nodes) {
          bbl.textContent = '';
          nodes = { reasoning: null, answer: null };
          liveAssistantNodes.set(bbl, nodes);
        }
        if (view.showReasoning) {
          if (!nodes.reasoning) {
            const details = document.createElement('details');
            details.className = 'reasoning-block';
            details.open = !view.collapsedReasoning && view.isThinking;
            details.innerHTML =
              '<summary><span class="reasoning-summary"><span class="reasoning-state"></span></span></summary><div class="reasoning-body"><div class="stream-markdown"></div></div>';
            nodes.reasoning = details;
            nodes.reasoningState = details.querySelector('.reasoning-state');
            nodes.reasoningBody = details.querySelector('.reasoning-body');
            nodes.reasoningText = details.querySelector('.stream-markdown');
            bbl.appendChild(details);
          }
          const body = nodes.reasoningBody;
          const pinned =
            nodes.reasoning.open && body.scrollHeight - body.scrollTop - body.clientHeight < 60;
          nodes.reasoningState.className = view.isThinking
            ? 'reasoning-state live'
            : 'reasoning-state';
          nodes.reasoningState.textContent = view.isThinking ? 'Thinking' : 'Reasoning';
          updateStreamMarkdown(
            nodes.reasoningText,
            (view.reasoning || '').trim() || (view.isThinking ? 'Thinking…' : ''),
          );
          if (pinned) body.scrollTop = body.scrollHeight;
        } else if (nodes.reasoning) {
          nodes.reasoning.remove();
          nodes.reasoning = null;
        }
        const answer = view.answer || (!view.showReasoning ? raw : '');
        if (answer) {
          if (!nodes.answer) {
            nodes.answer = document.createElement('div');
            nodes.answer.className = 'stream-markdown';
            bbl.appendChild(nodes.answer);
          }
          updateStreamMarkdown(nodes.answer, stripTrailingArtifacts(answer));
        } else if (nodes.answer) {
          nodes.answer.remove();
          nodes.answer = null;
        }
        if (cursor) bbl.appendChild(cursor);
        autoScroll();
        return view;
      }

      function completeAssistantHtml(bbl, html, reasoningOpen) {
        const existing = bbl.querySelector('.reasoning-block');
        const wasOpen = existing ? existing.open : reasoningOpen;
        const body = existing?.querySelector('.reasoning-body');
        const scroll = body?.scrollTop || 0;
        const completed = existing ? document.createElement('div') : null;
        if (completed) completed.innerHTML = html;
        const placeholder = completed?.querySelector('.reasoning-block');
        if (existing && placeholder) {
          // Keep the live disclosure in place, including its selected text and scroll.
          placeholder.remove();
          for (const child of Array.from(bbl.children)) if (child !== existing) child.remove();
          const state = existing.querySelector('.reasoning-state');
          if (state) {
            state.className = 'reasoning-state';
            state.textContent = 'Reasoning';
          }
          completed.className = 'assistant-completed';
          bbl.appendChild(completed);
          existing.open = wasOpen;
          if (body) body.scrollTop = scroll;
        } else {
          bbl.innerHTML = html;
          const reasoning = bbl.querySelector('.reasoning-block');
          if (reasoning && typeof wasOpen === 'boolean') reasoning.open = wasOpen;
        }
        liveAssistantNodes.delete(bbl);
        autoScroll();
      }

      const reasoningStateBindings = new WeakSet();
      function bindReasoningState(bbl, message) {
        const details = bbl.querySelector('.reasoning-block');
        if (!details) return;
        if (typeof message.reasoning_open === 'boolean') details.open = message.reasoning_open;
        if (reasoningStateBindings.has(details)) return;
        reasoningStateBindings.add(details);
        details.addEventListener('toggle', () => {
          message.reasoning_open = details.open;
          scheduleChatStateSave();
        });
      }

      function renderAssistantNotice(kind, title, message) {
        let tone = kind === 'error' ? 'error' : 'warn';
        let safeTitle = esc(title || (tone === 'error' ? 'Request failed' : 'Notice'));
        let safeMessage = esc(message || '');
        return (
          '<div class="assistant-note ' +
          tone +
          '"><strong>' +
          safeTitle +
          '</strong>' +
          (safeMessage ? '<span>' + safeMessage + '</span>' : '') +
          '</div>'
        );
      }

      function completionNotice(state) {
        let hasAnswer = !!state.hasAnswer;
        if (state.errorMessage) {
          return {
            kind: 'error',
            title: hasAnswer ? 'Response interrupted' : 'Request failed',
            message: state.errorMessage,
          };
        }
        if (state.finishReason === 'length') {
          return {
            kind: 'warn',
            title: 'Token limit reached',
            message: hasAnswer
              ? 'Response stopped at the current token limit. Ask to continue if you want the rest.'
              : 'Response hit the token limit before a final answer was returned.',
          };
        }
        if (state.missingFinishReason) {
          return {
            kind: 'warn',
            title: hasAnswer ? 'Response interrupted' : 'Connection interrupted',
            message: hasAnswer
              ? 'The stream ended before the server reported a clean finish.'
              : 'The stream ended before any final answer was returned.',
          };
        }
        if (state.suppressedReasoning && !hasAnswer) {
          return {
            kind: 'warn',
            title: 'No final answer',
            message: 'The model only produced a trivial reasoning stub and no usable final answer.',
          };
        }
        if (state.showReasoning && !hasAnswer) {
          return {
            kind: 'warn',
            title: 'No final answer',
            message: 'The model returned reasoning but no final answer.',
          };
        }
        if (!state.hadOutput) {
          return {
            kind: 'warn',
            title: 'Empty response',
            message: 'The model returned no visible content.',
          };
        }
        return null;
      }

      function persistAssistantNotice(message, notice, incomplete) {
        if (!message) return;
        if (notice) {
          message.notice_kind = notice.kind;
          message.notice_title = notice.title;
          message.notice_message = notice.message;
        } else {
          delete message.notice_kind;
          delete message.notice_title;
          delete message.notice_message;
        }
        if (incomplete) message.incomplete = true;
        else delete message.incomplete;
      }

      async function fetchRecoveredAnswer(model, messages, signal, mtpSetting) {
        let r = await fetch(base + '/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages,
            stream: false,
            max_tokens: 512,
            temperature: 1.0,
            enable_thinking: false,
            ...(mtpSetting !== undefined ? { enable_mtp: mtpSetting } : {}),
          }),
          signal,
        });
        if (!r.ok) {
          let e = await r.json().catch(() => ({}));
          throw new Error(e.error?.message || r.statusText);
        }
        let body = await r.json();
        let choice = body?.choices?.[0];
        let content = choice?.message?.content || '';
        return {
          content: stripTrailingArtifacts(stripInlineTransportArtifacts(content)),
          finishReason: choice?.finish_reason || 'stop',
          mtp: normalizeMtpResult(body.mtp),
        };
      }

      function renderStoredAssistant(message) {
        let bbl = addMsg('assistant', '');
        if (message.raw) {
          let rendered = assistantHtmlFromRaw(message.raw, false);
          bbl.innerHTML =
            rendered.html ||
            (message.content ? md(message.content) : '<p><em>Partial response.</em></p>');
        } else {
          bbl.innerHTML = message.content ? md(message.content) : '';
        }
        bindReasoningState(bbl, message);
        if (message.notice_message) {
          bbl.insertAdjacentHTML(
            'beforeend',
            renderAssistantNotice(
              message.notice_kind,
              message.notice_title,
              message.notice_message,
            ),
          );
        }
        if (message.partial) {
          let meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = 'Restored partial response after refresh';
          bbl.parentElement.appendChild(meta);
        } else if (message.incomplete) {
          let meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent =
            'Previous response was incomplete and is excluded from follow-up history';
          bbl.parentElement.appendChild(meta);
        }
        if (message.mtp) {
          const meta = document.createElement('div');
          meta.className = 'meta mtp-meta';
          meta.textContent = formatMtpResult(message.mtp);
          bbl.parentElement.appendChild(meta);
        }
      }

      function renderConversation() {
        M.innerHTML = '';
        if (!H.length) {
          showEmptyState();
          return;
        }
        for (let message of H) {
          if (message.role === 'user') addMsg('user', message.content || '');
          else renderStoredAssistant(message);
        }
        highlightAll();
        M.scrollTop = M.scrollHeight;
      }

      function restoreChatState() {
        let state = readChatState();
        H = state.messages;
        chatSessionId = state.sessionId || newChatSessionId();
        renderConversation();
        I.value = state.input;
        I.style.height = 'auto';
        I.style.height = Math.max(42, Math.min(I.scrollHeight || 42, 140)) + 'px';
        updateComposerState();
      }

      function setCurrentModel(model) {
        setModelTag(model ? model.display_name || model.id : '');
        if (model && model.homepage_url && /^https?:\/\//i.test(model.homepage_url))
          MN.href = model.homepage_url;
      }

      function setGpuMemory(info, budgetArg) {
        let used = 0,
          budget = 0,
          ctxReserved = 0,
          ctxActive = 0,
          ctxTokens = 0,
          ctxCapacity = 0;
        if (typeof info === 'object' && info) {
          used = info.gpu_memory_used_bytes || info.active_memory_used_bytes || 0;
          budget = info.gpu_memory_budget_bytes || info.active_memory_budget_bytes || 0;
          ctxReserved = info.gpu_context_reserved_bytes || info.active_context_reserved_bytes || 0;
          ctxActive = info.gpu_context_active_bytes || info.active_context_active_bytes || 0;
          ctxTokens = info.gpu_context_tokens || info.active_context_tokens || 0;
          ctxCapacity =
            info.gpu_context_capacity_tokens || info.active_context_capacity_tokens || 0;
        } else {
          used = info || 0;
          budget = budgetArg || 0;
        }
        if (!used || !budget) {
          GM.textContent = '';
          GM.title = '';
          return;
        }
        let text = 'VRAM ' + fmtGiB(used) + ' / ' + fmtGiB(budget) + ' GiB';
        if (ctxReserved > 0 && ctxCapacity > 0) {
          if (ctxTokens > 0 || ctxActive > 0) {
            text +=
              ' · ctx ' +
              fmtGiB(ctxActive) +
              ' / ' +
              fmtGiB(ctxReserved) +
              ' GiB (' +
              ctxTokens +
              '/' +
              ctxCapacity +
              ' tok)';
          } else {
            text += ' · ctx reserved ' + fmtGiB(ctxReserved) + ' GiB (' + ctxCapacity + ' tok cap)';
          }
        }
        GM.textContent = text;
        if (ctxReserved > 0 && ctxCapacity > 0) {
          GM.title =
            'The total VRAM number includes the full reserved KV context budget. Active ctx shows how much of that reserved space the current chat is actually using.';
        } else {
          GM.title = '';
        }
      }

      function updateDownloadUi() {
        let m = currentDownloadModel();
        if (!m) {
          DL.textContent = '';
          MP.hidden = true;
          MP.classList.remove('indeterminate');
          MPF.style.width = '0%';
          stopModelRefresh();
          return;
        }
        if (m.download_phase === 'failed') {
          DL.textContent = 'Download failed: ' + (m.download_error || m.display_name || m.id);
          MP.hidden = true;
          stopModelRefresh();
          return;
        }
        if (m.download_phase === 'verifying') {
          DL.textContent = 'Verifying ' + (m.display_name || m.id) + '...';
          MP.hidden = false;
          MP.classList.add('indeterminate');
          MPF.style.width = '35%';
          scheduleModelRefresh(800);
          return;
        }
        let done = m.downloaded_bytes || 0,
          total = m.download_total_bytes || 0;
        DL.textContent =
          'Downloading ' +
          (m.display_name || m.id) +
          (total > 0
            ? ' · ' + Math.max(0, Math.min(100, Math.round((done * 100) / total))) + '%'
            : '');
        MP.hidden = false;
        if (total > 0) {
          MP.classList.remove('indeterminate');
          MPF.style.width = Math.max(2, Math.min(100, (done * 100) / total)) + '%';
        } else {
          MP.classList.add('indeterminate');
          MPF.style.width = '35%';
        }
        scheduleModelRefresh(800);
      }

      function updateModelAction() {
        let m = selectedModel();
        MB.hidden = !m || (!!m.active && !modelCanUnload());
        if (!m) {
          MB.textContent = 'Model';
          MB.disabled = true;
          return;
        }
        MB.className = 'model-action';
        MB.disabled = modelActionPending || isGenerating || hasActiveDownload();
        if (modelActionPending) {
          MB.textContent = modelActionKind || 'Please wait…';
          return;
        }
        if (m.active) {
          MB.textContent = 'Unload model';
          return;
        }
        if (!(m.installed ? modelCanLoad(m) : modelCanPull(m))) {
          MB.textContent = m.installed ? 'Unavailable' : 'Not installed';
          MB.disabled = true;
          return;
        }
        if (m.download_phase === 'failed') {
          MB.textContent = 'Retry';
          MB.classList.add('download');
          return;
        }
        if (m.downloading) {
          MB.textContent = 'Downloading';
          return;
        }
        if (m.download_phase === 'verifying') {
          MB.textContent = 'Verifying';
          return;
        }
        if (m.fits_current_gpu === false) {
          MB.textContent = 'Too large';
          MB.disabled = true;
          return;
        }
        MB.textContent = m.installed ? 'Load model' : 'Download';
        if (!m.installed) MB.classList.add('download');
      }

      function updateThinkingUi() {
        let supported = activeModelSupportsThinking();
        TH.checked = supported ? chatPrefs.thinkingEnabled !== false : false;
        TH.disabled = !supported || isGenerating || modelActionPending;
        TW.classList.toggle('disabled', !supported || isGenerating || modelActionPending);
        TL.textContent = supported ? 'Thinking' : 'Thinking n/a';
        TW.title = supported
          ? 'Enable model reasoning in chat responses'
          : 'The active model does not expose a thinking toggle';
      }

      let runtimeMtpCapability = null;
      let supportsChatSessionReset = false;
      function setRuntimeMtpCapability(info) {
        if (typeof info?.supports_mtp === 'boolean') runtimeMtpCapability = info;
      }
      function currentMtpCapability() {
        const model = activeModel();
        if (modelsReady && !model)
          return {
            supports_mtp: false,
            mtp_default_enabled: false,
            mtp_request_control: false,
            mtp_unavailable_reason: 'Load a model to use MTP.',
          };
        return runtimeMtpCapability ? { ...model, ...runtimeMtpCapability } : model || {};
      }
      function activeModelSupportsMtp() {
        return currentMtpCapability().supports_mtp === true;
      }
      function mtpRequestSetting() {
        const capability = currentMtpCapability();
        if (capability.supports_mtp !== true || capability.mtp_request_control !== true)
          return undefined;
        return chatPrefs.mtpPreference === 'auto' ? null : chatPrefs.mtpPreference === 'on';
      }
      function mtpEnabledForRequest() {
        const setting = mtpRequestSetting();
        return setting === undefined || setting === null
          ? currentMtpCapability().mtp_default_enabled === true
          : setting;
      }
      function updateMtpUi() {
        const capability = currentMtpCapability();
        const reported = typeof capability.supports_mtp === 'boolean';
        const supported = capability.supports_mtp === true;
        const controllable = supported && capability.mtp_request_control === true;
        const enabled = mtpEnabledForRequest();
        const toggle = document.getElementById('mtp-control');
        const input = document.getElementById('mtp');
        const status = document.getElementById('mtp-status');
        const label = document.getElementById('mtp-label');
        const reset = document.getElementById('mtp-reset');
        const unknown =
          'This server does not report MTP capability or active status. Its own settings may enable MTP automatically.';
        const reason = supported
          ? controllable
            ? 'MTP ' +
              (enabled ? 'on' : 'off') +
              ' for the next reply' +
              (chatPrefs.mtpPreference === 'auto' ? ' (engine default)' : '') +
              '. Execution is confirmed on the completed reply.'
            : 'MTP is managed by this server; per-request control is not advertised.'
          : reported
            ? capability.mtp_unavailable_reason || 'MTP is unavailable in this server runtime.'
            : unknown;

        }
        if (reset) {
          reset.hidden = !controllable || chatPrefs.mtpPreference === 'auto';
          reset.disabled = isGenerating || modelActionPending;
        }
        if (status) {
          status.textContent = supported
            ? controllable
              ? 'Next reply: MTP ' +
                (enabled ? 'on' : 'off') +
                (chatPrefs.mtpPreference === 'auto' ? ' (engine default)' : '')
              : 'MTP managed by the engine'

              : 'MTP status not reported by this server';

      function normalizeMtpResult(value) {
        if (
          !value ||
          typeof value !== 'object' ||
          typeof value.enabled !== 'boolean' ||
          typeof value.used !== 'boolean'
        )
          return null;
        if (value.requested !== null && typeof value.requested !== 'boolean') return null;
        const counters = ['drafted', 'accepted', 'cycles'];
        if (counters.some((key) => !Number.isSafeInteger(value[key]) || value[key] < 0))
          return null;
        if (
          value.accepted > value.drafted ||
          (value.used && (!value.enabled || value.cycles === 0)) ||
          (!value.enabled && counters.some((key) => value[key] !== 0))
        )
          return null;
        return {
          requested: value.requested,
          enabled: value.enabled,
          used: value.used,
          drafted: value.drafted,
          accepted: value.accepted,
          cycles: value.cycles,
          fallback_reason:
            typeof value.fallback_reason === 'string' ? value.fallback_reason.slice(0, 400) : null,
        };

      function formatMtpResult(result) {

            (result.fallback_reason ? ' · ' + result.fallback_reason : '')

        if (!result.enabled) return 'MTP off';
        return 'MTP enabled · no draft cycle needed';
      }
      function showMtpResult(result, meta) {
        const status = document.getElementById('mtp-last-status');
        if (!result) {
          if (status) status.textContent = 'Last reply: MTP execution not reported';

        if (status) status.textContent = 'Last reply: ' + summary;
        if (meta) meta.textContent += ' · ' + summary;
      }

      async function refreshModels() {
        const version = modelStateVersion;
        try {
          let response = await fetch(base + '/models');
          if (!response.ok) throw new Error('Model catalog is unavailable');
          let data = await response.json();
          if (version !== modelStateVersion) return false;
          setModelCapabilities(data);
          const previousActiveId = models.find((model) => model.active)?.id;
          models = Array.isArray(data.data) ? data.data : [];
          const nextActive = models.find((model) => model.active);
          if (
            typeof nextActive?.supports_mtp === 'boolean' ||
            (previousActiveId && previousActiveId !== nextActive?.id)
          )
            runtimeMtpCapability = null;
          modelsReady = true;
          if (modelConnectionFailed) {
            showUiNotice('');
            modelConnectionFailed = false;
          }
          let selectedId = MS.value;
          let current = models.find((m) => m.active) || null;
          let selected = models.find((m) => m.id === selectedId) || current || models[0] || null;
          let options = models.map((m) => {
            let label = m.display_name || m.id;
            if (m.active) label += ' · ready';
            else if (!m.managed && !m.installed) label += ' · manual';
            else if (m.downloading) label += ' · downloading';
            else if (m.download_phase === 'verifying') label += ' · verifying';
            else if (m.installed) label += ' · installed';
            else label += ' · download';
            return { id: m.id, label };
          });
          if (!options.length) options = [{ id: '', label: 'No models available' }];
          let signature = JSON.stringify(options);
          if (refreshModels.optionsSignature !== signature) {
            MS.innerHTML = '';
            for (let item of options) {
              let opt = document.createElement('option');
              opt.value = item.id;
              opt.textContent = item.label;
              MS.appendChild(opt);
            }
            refreshModels.optionsSignature = signature;
          }
          MS.value = selected ? selected.id : '';
          setGpuMemory(data);
          setRuntimeMtpCapability(data);
          setCurrentModel(current);
          updateDownloadUi();
          updateModelAction();
          updateThinkingUi();
          updateMtpUi();
          updateModelSelect();
          updateComposerState();
          updateEmptyState();
          return true;
        } catch (error) {
          if (version !== modelStateVersion) return false;
          modelConnectionFailed = true;
          showUiNotice(
            'Could not reach ZINC. Check that the server is running. Reconnecting…',
            true,
          );
          if (!modelsReady) {
            MS.innerHTML = '<option value="">Waiting for server…</option>';
            MS.disabled = true;
            MB.hidden = true;
          }
          scheduleModelRefresh(5000);
          return false;
        }
      }

      async function refreshHealth() {
        const version = modelStateVersion;
        try {
          let response = await fetch(base.replace('/v1', '/health'));
          if (!response.ok) throw new Error('Health unavailable');
          let data = await response.json();
          if (version !== modelStateVersion) return;
          if (data.status !== 'ok') throw new Error('Health unavailable');
          supportsChatSessionReset = data.capabilities?.chat_session_reuse === true;
          setModelCapabilities(data);
          ST.textContent = 'Connected';

          setGpuMemory(data);
          setRuntimeMtpCapability(data);

      function esc(s) {

      function setGenerating(v) {

      function stopGeneration() {
