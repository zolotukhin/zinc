      function fmtInline(s) {
        // Keep code and link targets out of the emphasis pass. Input is already
        // HTML-escaped by md(), but quotes still need escaping inside attributes.
        const spans = [];
        const keep = (html) => '\x00INLINE' + (spans.push(html) - 1) + '\x00';
        s = s.replace(
          /\\([\\`*_{}\[\]()#+.!|>~-])|(`+)([^`]+?)\2|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          (_, literal, ticks, code, label, url) => {
            if (literal) return keep(literal);
            if (ticks) return keep('<code>' + code + '</code>');
            const href = url.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            return keep(
              '<a href="' +
                href +
                '" target="_blank" rel="noopener noreferrer">' +
                fmtInline(label) +
                '</a>',
            );
          },
        );
        s = s.replace(/\*\*(?=\S)(.+?\S|\S)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__(?=\S)(.+?\S|\S)__/g, '<strong>$1</strong>');
        s = s.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, '<em>$1</em>');
        s = s.replace(/(^|[\s(])_([^_\n]+?)_(?=$|[\s).,!?])/g, '$1<em>$2</em>');
        s = s.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
        return s.replace(/\x00INLINE(\d+)\x00/g, (_, index) => spans[Number(index)]);
      }

      function renderParagraph(lines) {
        return '<p>' + lines.map(fmtInline).join('<br>') + '</p>';
      }

      function renderNestedList(items, ordered) {
        if (!items.length) return '';
        let tag = ordered ? 'ol' : 'ul';
        return (
          '<' +
          tag +
          '>' +
          items.map((item) => '<li>' + item.map(fmtInline).join('<br>') + '</li>').join('') +
          '</' +
          tag +
          '>'
        );
      }

      function renderList(lines, ordered) {
        let items = [],
          current = null;
        let marker = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
        function pushCurrent() {
          if (!current) return;
          items.push(current);
          current = null;
        }
        for (let line of lines) {
          if (!line.trim()) continue;
          let match = line.match(marker);
          if (match) {
            pushCurrent();
            current = { lines: [match[1]], nestedUnordered: [], nestedOrdered: [] };
            continue;
          }
          if (!current) return '';
          let nestedUnordered = line.match(/^\s*[-*+]\s+(.*)$/);
          if (ordered && nestedUnordered) {
            let last = current.nestedUnordered[current.nestedUnordered.length - 1];
            if (last && line.match(/^\s{2,}\S/) && !line.match(/^\s{2,}[-*+]\s+/)) {
              last.push(line.trim());
            } else {
              current.nestedUnordered.push([nestedUnordered[1]]);
            }
            continue;
          }
          let nestedOrdered = line.match(/^\s*\d+\.\s+(.*)$/);
          if (!ordered && nestedOrdered) {
            let last = current.nestedOrdered[current.nestedOrdered.length - 1];
            if (last && line.match(/^\s{2,}\S/) && !line.match(/^\s{2,}\d+\.\s+/)) {
              last.push(line.trim());
            } else {
              current.nestedOrdered.push([nestedOrdered[1]]);
            }
            continue;
          }
          if (current.nestedUnordered.length && line.match(/^\s{2,}\S/)) {
            current.nestedUnordered[current.nestedUnordered.length - 1].push(line.trim());
            continue;
          }
          if (current.nestedOrdered.length && line.match(/^\s{2,}\S/)) {
            current.nestedOrdered[current.nestedOrdered.length - 1].push(line.trim());
            continue;
          }
          current.lines.push(line.trim());
        }
        pushCurrent();
        if (!items.length) return '';
        let tag = ordered ? 'ol' : 'ul';
        return (
          '<' +
          tag +
          '>' +
          items
            .map((item) => {
              let html = item.lines.map(fmtInline).join('<br>');
              html += renderNestedList(item.nestedUnordered, false);
              html += renderNestedList(item.nestedOrdered, true);
              return '<li>' + html + '</li>';
            })
            .join('') +
          '</' +
          tag +
          '>'
        );
      }

      function isMarkdownRule(line) {
        return /^ {0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})$/.test(line);
      }

      function markdownTableCells(line) {
        const cells = [];
        let cell = '',
          ticks = 0;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '\\' && i + 1 < line.length) {
            cell += ch + line[++i];
            continue;
          }
          if (ch === '`') {
            let end = i + 1;
            while (line[end] === '`') end++;
            const count = end - i;
            if (!ticks) ticks = count;
            else if (ticks === count) ticks = 0;
            cell += line.slice(i, end);
            i = end - 1;
            continue;
          }
          if (ch === '|' && !ticks) {
            cells.push(cell.trim());
            cell = '';
          } else cell += ch;
        }
        cells.push(cell.trim());
        if (cells[0] === '') cells.shift();
        if (cells[cells.length - 1] === '') cells.pop();
        return cells;
      }

      function markdownTableAlignments(line, count) {
        const cells = markdownTableCells(line);
        if (cells.length !== count || cells.some((cell) => !/^:?-{3,}:?$/.test(cell))) return null;
        return cells.map((cell) =>
          cell.startsWith(':')
            ? cell.endsWith(':')
              ? 'center'
              : 'left'
            : cell.endsWith(':')
              ? 'right'
              : '',
        );
      }

      function renderMarkdownTable(lines) {
        if (lines.length < 2 || !lines[0].includes('|')) return '';
        const header = markdownTableCells(lines[0]);
        const alignment = markdownTableAlignments(lines[1], header.length);
        if (!alignment) return '';
        const row = (cells, tag) =>
          '<tr>' +
          header
            .map(
              (_, i) =>
                '<' +
                tag +
                (alignment[i] ? ' style="text-align:' + alignment[i] + '"' : '') +
                '>' +
                fmtInline(cells[i] || '') +
                '</' +
                tag +
                '>',
            )
            .join('') +
          '</tr>';
        return (
          '<div class="table-scroll"><table><thead>' +
          row(header, 'th') +
          '</thead><tbody>' +
          lines
            .slice(2)
            .filter((line) => line.trim())
            .map((line) => row(markdownTableCells(line), 'td'))
            .join('') +
          '</tbody></table></div>'
        );
      }

      function renderBlock(block) {
        let trimmed = block.trim();
        if (!trimmed) return '';
        if (/^\x00BLOCK\d+\x00$/.test(trimmed)) return trimmed;
        if (isMarkdownRule(trimmed)) return '<hr>';
        let heading = trimmed.match(/^(#{1,6})\s+(.+?)(?:\s+#+\s*)?$/);
        if (heading) {
          let level = heading[1].length;
          return '<h' + level + '>' + fmtInline(heading[2]) + '</h' + level + '>';
        }
        let lines = block.split('\n');
        if (/^\s{0,3}&gt;(?: |$)/.test(trimmed)) {
          const quote = lines.map((line) => line.replace(/^\s{0,3}&gt; ?/, '')).join('\n');
          return (
            '<blockquote>' +
            splitMarkdownBlocks(normalizeHeadingSpacing(normalizeListSpacing(quote)))
              .map(renderBlock)
              .join('') +
            '</blockquote>'
          );
        }
        const table = renderMarkdownTable(lines);
        if (table) return table;
        if (/^\s*\d+\.\s+/.test(trimmed)) {
          let list = renderList(lines, true);
          if (list) return list;
        }
        if (/^\s*[-*+]\s+/.test(trimmed)) {
          let list = renderList(lines, false);
          if (list) return list;
        }
        return renderParagraph(lines);
      }

      function normalizeListSpacing(text) {
        let lines = (text || '').split('\n');
        let out = [];
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          if (line.trim()) {
            out.push(line);
            continue;
          }
          let prev = '';
          for (let j = out.length - 1; j >= 0; j--) {
            if (out[j].trim()) {
              prev = out[j];
              break;
            }
          }
          let next = '';
          for (let j = i + 1; j < lines.length; j++) {
            if (lines[j].trim()) {
              next = lines[j];
              break;
            }
          }
          let prevOrdered = /^\s*\d+\.\s+/.test(prev);
          let nextOrdered = /^\s*\d+\.\s+/.test(next);
          let prevUnordered = /^\s*[-*]\s+/.test(prev);
          let nextUnordered = /^\s*[-*]\s+/.test(next);
          if ((prevOrdered && nextOrdered) || (prevUnordered && nextUnordered)) continue;
          out.push(line);
        }
        return out.join('\n');
      }

      function normalizeHeadingSpacing(text) {
        let lines = (text || '').split('\n');
        let out = [];
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          let trimmed = line.trim();
          if (!/^#{1,6}\s+\S/.test(trimmed)) {
            out.push(line);
            continue;
          }
          let prev = out.length ? out[out.length - 1] : '';
          if (prev.trim()) out.push('');
          out.push(line);
          let next = '';
          for (let j = i + 1; j < lines.length; j++) {
            if (lines[j].trim() || j === lines.length - 1) {
              next = lines[j];
              break;
            }
          }
          if (next.trim()) out.push('');
        }
        return out.join('\n');
      }

      function splitMarkdownBlocks(text) {
        const lines = (text || '').split('\n');
        const blocks = [];
        let i = 0;
        function kindOf(line) {
          if (!line.trim()) return 'blank';
          if (/^\x00BLOCK\d+\x00$/.test(line)) return 'code';
          if (isMarkdownRule(line)) return 'rule';
          if (/^\s*\d+\.\s+/.test(line)) return 'ordered';
          if (/^\s*[-*+]\s+/.test(line)) return 'unordered';
          if (/^\s{0,3}&gt;(?: |$)/.test(line)) return 'quote';
          if (/^#{1,6}\s+\S/.test(line.trim())) return 'heading';
          if (/^\s{2,}\S/.test(line)) return 'indented';
          return 'text';
        }
        function isTableStart(index) {
          return (
            index + 1 < lines.length &&
            lines[index].includes('|') &&
            !!markdownTableAlignments(lines[index + 1], markdownTableCells(lines[index]).length)
          );
        }
        while (i < lines.length) {
          while (i < lines.length && !lines[i].trim()) i++;
          if (i >= lines.length) break;
          const start = i,
            mode = kindOf(lines[i]);
          if (mode === 'code' || mode === 'rule' || mode === 'heading') {
            blocks.push(lines[i++]);
            continue;
          }
          if (isTableStart(i)) {
            i += 2;
            while (i < lines.length && lines[i].trim() && lines[i].includes('|')) i++;
            blocks.push(lines.slice(start, i).join('\n'));
            continue;
          }
          if (mode === 'quote') {
            i++;
            while (
              i < lines.length &&
              (kindOf(lines[i]) === 'quote' ||
                (!lines[i].trim() && kindOf(lines[i + 1] || '') === 'quote'))
            )
              i++;
            blocks.push(lines.slice(start, i).join('\n'));
            continue;
          }
          if (mode !== 'ordered' && mode !== 'unordered') {
            i++;
            while (
              i < lines.length &&
              lines[i].trim() &&
              ['text', 'indented'].includes(kindOf(lines[i])) &&
              !isTableStart(i)
            )
              i++;
            blocks.push(lines.slice(start, i).join('\n'));
            continue;
          }
          i++;
          let prevBlank = false;
          while (i < lines.length) {
            const kind = kindOf(lines[i]);
            if (kind === 'blank') {
              prevBlank = true;
              i++;
              continue;
            }
            if (isTableStart(i)) break;
            if (
              kind === mode ||
              kind === 'indented' ||
              (mode === 'ordered' && kind === 'unordered')
            ) {
              prevBlank = false;
              i++;
              continue;
            }
            if (kind === 'text' && !prevBlank) {
              i++;
              continue;
            }
            break;
          }
          blocks.push(lines.slice(start, i).join('\n'));
        }
        return blocks;
      }

      function md(s) {
        // Isolate fences before escaping or normalizing prose so code retains its
        // whitespace, punctuation, and line breaks, including an unfinished fence.
        const blocks = [],
          lines = (s || '').replace(/\r\n?/g, '\n').replace(/\x00/g, '').split('\n'),
          prose = [];
        function makeBlock(info, code, complete) {
          const label = info.trim().split(/\s+/)[0] || 'code';
          const language = /^[a-zA-Z0-9_+-]+$/.test(label) ? label : 'plaintext';
          const btn = complete
            ? '<button class="copy-btn" onclick="copyCode(this)">Copy</button>'
            : '';
          return (
            '<div class="code-block"><div class="code-header"><span>' +
            esc(label) +
            '</span>' +
            btn +
            '</div><pre><code class="language-' +
            language +
            '">' +
            esc(code) +
            '</code></pre></div>'
          );
        }
        for (let i = 0; i < lines.length; i++) {
          const fence = lines[i].match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
          if (!fence) {
            prose.push(lines[i]);
            continue;
          }
          const body = [],
            marker = fence[1][0],
            length = fence[1].length;
          let complete = false;
          for (i++; i < lines.length; i++) {
            const close = lines[i].match(/^ {0,3}(`{3,}|~{3,})\s*$/);
            if (close && close[1][0] === marker && close[1].length >= length) {
              complete = true;
              break;
            }
            body.push(lines[i]);
          }
          const code = body.join('\n') + (complete && body.length ? '\n' : '');
          const index = blocks.push(makeBlock(fence[2], code, complete)) - 1;
          prose.push('\x00BLOCK' + index + '\x00');
        }
        let text = esc(prose.join('\n'));
        text = normalizeListSpacing(text);
        text = normalizeHeadingSpacing(text);
        let html = splitMarkdownBlocks(text).map(renderBlock).filter(Boolean).join('');
        for (let i = 0; i < blocks.length; i++)
          html = html.replace('\x00BLOCK' + i + '\x00', blocks[i]);
        return html;
      }

      function hasStructuredReasoning(text) {
        return /(?:^|\n)\s*(?:\d+\.\s+|[-*]\s+|#{1,4}\s+)/.test(text || '');
      }

      function reasoningPreview(text) {
        let compact = (text || '')
          .split('\n')
          .map((line) => line.replace(/^\s*(?:\d+\.\s+|[-*]\s+)/, '').trim())
          .filter(Boolean)
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!compact) return '';
        return compact.length > 96 ? compact.slice(0, 95) + '…' : compact;
      }

      function renderReasoning(thinkText, isThinking, collapsed) {
        let structured = hasStructuredReasoning(thinkText);
        let open = collapsed ? '' : isThinking || structured ? ' open' : '';
        let liveText = (thinkText || '').trim();
        let body = isThinking
          ? liveText
            ? md(liveText)
            : '<p><em>Thinking...</em></p>'
          : md(liveText);
        let stateClass = isThinking ? 'reasoning-state live' : 'reasoning-state';
        let stateText = isThinking ? 'Thinking' : 'Reasoning';
        return (
          '<details' +
          open +
          ' class="reasoning-block"><summary><span class="reasoning-summary"><span class="' +
          stateClass +
          '">' +
          stateText +
          '</span></span></summary><div class="reasoning-body">' +
          body +
          '</div></details>'
        );
      }

      function renderLiveText(text) {
        let s = stripTrailingArtifacts(text || '');
        return s ? '<div class="stream-markdown">' + md(s) + '</div>' : '';
      }

      function renderLiveReasoning(thinkText, isThinking, collapsed) {
        let open = collapsed ? '' : isThinking ? ' open' : '';
        let body = (thinkText || '').trim();
        let stateClass = isThinking ? 'reasoning-state live' : 'reasoning-state';
        let stateText = isThinking ? 'Thinking' : 'Reasoning';
        let bodyHtml = body ? renderLiveText(body) : '<p><em>Thinking...</em></p>';
        return (
          '<details' +
          open +
          ' class="reasoning-block"><summary><span class="reasoning-summary"><span class="' +
          stateClass +
          '">' +
          stateText +
          '</span></span></summary><div class="reasoning-body">' +
          bodyHtml +
          '</div></details>'
        );
      }

      function stripTrailingStandaloneQuote(text) {
        let s = (text || '').replace(/\s+$/, '');
        if (/(?:^|\r?\n)\s*"\s*$/u.test(s))
          s = s.replace(/(?:^|\r?\n)\s*"\s*$/u, '').replace(/\s+$/, '');
        if (s.endsWith('"')) {
          let body = s
            .slice(0, -1)
            .replace(/\uFFFD+$/gu, '')
            .replace(/\s+$/, '');
          let quoteCount = (body.match(/"/g) || []).length;
          if (body && quoteCount % 2 === 0) s = body;
        }
        return s;
      }

      function stripLeadingStandaloneQuote(text) {
        let s = text || '';
        if (/^\s*"\s*(?:\n\s*)+/u.test(s)) s = s.replace(/^\s*"\s*(?:\n\s*)+/u, '');
        return s;
      }

      function stripTrailingDanglingHeading(text) {
        let s = (text || '').replace(/\s+$/, '');
        if (/(?:^|\n)#{1,4}\s*$/u.test(s))
          s = s.replace(/(?:^|\n)#{1,4}\s*$/u, '').replace(/\s+$/, '');
        return s;
      }

      function stripTrailingDanglingListMarker(text) {
        let s = (text || '').replace(/\s+$/, '');
        if (/(?:^|\n)[-*]\s*$/u.test(s)) s = s.replace(/(?:^|\n)[-*]\s*$/u, '').replace(/\s+$/, '');
        return s;
      }

      function stripTrailingArtifacts(text) {
        let s = text || '';
        while (true) {
          let next = s;
          next = stripLeadingStandaloneQuote(next);
          next = next.replace(/(?:<\|im_end\|>|<\|im_start\|>assistant)\s*$/u, '');
          next = next.replace(/<\|endoftext\|>\s*$/u, '');
          next = next.replace(/(?:[\s\uFFFD])+$/gu, '');
          next = stripTrailingStandaloneQuote(next);
          next = stripTrailingDanglingHeading(next);
          next = stripTrailingDanglingListMarker(next);
          if (next === s) return next;
          s = next;
        }
      }

      function stripInlineTransportArtifacts(text) {
        return (text || '')
          .replace(/<\|im_end\|>/gu, '')
          .replace(/<\|im_start\|>assistant/gu, '')
          .replace(/<\|im_start\|>/gu, '')
          .replace(/<\|endoftext\|>assistant/gu, '')
          .replace(/<\|endoftext\|>/gu, '');
      }

      function findInlineStopArtifactStart(text) {
        let s = text || '';
        let markers = ['<|endoftext|>', '<|im_end|>', '<|im_start|>assistant', '<|im_start|>'];
        let first = -1;
        for (let marker of markers) {
          let idx = s.indexOf(marker);
          if (idx !== -1 && (first === -1 || idx < first)) first = idx;
        }
        return first;
      }

      function hasInlineStopArtifact(text) {
        return findInlineStopArtifactStart(text) !== -1;
      }

      function looksLikeRepeatedParagraphLoop(text) {
        let lines = (text || '')
          .split(/\n+/u)
          .map((line) =>
            line
              .toLowerCase()
              .replace(/[^a-z0-9 ]+/gu, ' ')
              .replace(/\s+/gu, ' ')
              .trim(),
          )
          .filter((line) => line.length >= 80);
        if (lines.length < 3) return false;
        let counts = new Map();
        for (let line of lines) {
          let key = line.slice(0, 48);
          if (key.length < 40) continue;
          let count = (counts.get(key) || 0) + 1;
          if (count >= 3) return true;
          counts.set(key, count);
        }
        return false;
      }

      function hasRepeatedPhraseLoop(text) {
        let s = text || '';
        if (s.length < 80) return false;
        // Collect sentence-boundary starts
        let starts = [0];
        for (let i = 0; i + 1 < s.length && starts.length < 64; i++) {
          if (s[i] === '.' && s[i + 1] === ' ') starts.push(i + 2);
        }
        for (let start of starts) {
          if (start + 20 > s.length) continue;
          for (let plen = 20; plen <= Math.min(60, s.length - start); plen += 5) {
            let phrase = s.slice(start, start + plen);
            let count = 1,
              from = start + plen;
            while (from + plen <= s.length) {
              let idx = s.indexOf(phrase, from);
              if (idx === -1 || idx + plen > s.length) break;
              count++;
              if (count >= 3) return true;
              from = idx + plen;
            }
          }
        }
        return false;
      }

      function findRestartedAnswerStart(text) {
        let s = text || '';
        if (s.length < 160) return -1;
        let prefixLen = Math.min(s.length, 96);
        if (prefixLen < 48) return -1;
        let prefix = s.slice(0, prefixLen);
        let searchFrom = prefixLen + 64;
        while (searchFrom + prefixLen <= s.length) {
          let idx = s.indexOf(prefix, searchFrom);
          if (idx === -1) return -1;
          let atLineStart = idx > 0 && s[idx - 1] === '\n';
          let atParagraphStart = idx > 1 && s[idx - 2] === '\n' && s[idx - 1] === '\n';
          if (atLineStart || atParagraphStart) return idx;
          searchFrom = idx + 1;
        }
        return -1;
      }

      function trimRestartedAnswer(text) {
        let s = text || '';
        let idx = findRestartedAnswerStart(s);
        return idx === -1 ? s : s.slice(0, idx).replace(/\s+$/u, '');
      }

      function findLeakedReasoningStart(text) {
        let s = text || '';
        let markers = [
          '\n\nThe user is asking',
          "\n\nThe user's request",
          '\n\nHere is the response:',
          '\n\nI will provide a direct answer',
          '\n\nI will provide the response',
          '\n\nI will answer directly',
          '\nSince I am acting as the assistant',
          ' Since I am acting as the assistant',
          '\nHowever, looking at the prompt structure',
          ' However, looking at the prompt structure',
          '\nWait, looking closely at the prompt structure',
          ' Wait, looking closely at the prompt structure',
        ];
        let first = -1;
        for (let marker of markers) {
          let idx = s.indexOf(marker);
          if (idx >= 48 && (first === -1 || idx < first)) first = idx;
        }
        return first;
      }

      function startsWithLeakedReasoning(text) {
        let s = (text || '').trimStart().toLowerCase();
        return /^(the user is asking|the user's (request|question)|i need to (provide|answer|respond|complete|continue|help)|i should (answer|provide|respond|help)|i will (provide|answer|respond)|let me (answer|provide|respond|think|analyze))/.test(
          s,
        );
      }

      function trimLeakedNoThinkingOutput(text) {
        let s = text || '';
        if (startsWithLeakedReasoning(s)) {
          // Entire output is leaked reasoning — look for where the actual answer starts
          let answerStart = s.search(/\n\n(?=[A-Z](?!.*(I need|I should|The user|Let me)))/u);
          if (answerStart >= 0) return s.slice(answerStart + 2);
          return '';
        }
        let idx = findLeakedReasoningStart(s);
        return idx === -1 ? s : s.slice(0, idx).replace(/\s+$/u, '');
      }

      function findUnexpectedThinkingTailStart(text) {
        let s = text || '';
        let searchFrom = 0;
        // If text starts with <think>, skip past the first </think> so we detect REOPENED blocks
        if (s.trimStart().startsWith('<think>')) {
          let closeIdx = s.indexOf('</think>');
          if (closeIdx === -1) return -1;
          searchFrom = closeIdx + '</think>'.length;
        }
        let idx = s.indexOf('<think>', searchFrom);
        if (idx === -1) return -1;
        let prefix = s.slice(0, idx).trim();
        return prefix ? idx : -1;
      }

      function trimUnexpectedThinkingTail(text) {
        let s = text || '';
        let idx = findUnexpectedThinkingTailStart(s);
        if (idx === -1) return s;
        let trimmed = s.slice(0, idx).replace(/\s+$/u, '');
        return trimmed ? trimmed : s;
      }

      function sanitizeAnswerTail(text) {
        return trimRestartedAnswer(
          stripTrailingArtifacts(
            trimLeakedNoThinkingOutput(trimUnexpectedThinkingTail(text || '')).trim(),
          ),
        );
      }

      function looksLikeGenuineReasoning(text) {
        let s = (text || '').trim().toLowerCase();
        return /^(the user |the question |i need to |i should |i will |let me |this is |okay,? |alright,? |so,? the user)/u.test(
          s,
        );
      }

      function looksLikePlainReasoning(text) {
        let s = (text || '').trimStart();
        return (
          s.startsWith('Thinking Process:') ||
          /^\d+\.\s+\*\*Analyze the Request:\*\*/.test(s) ||
          /^\d+\.\s+Analyze the Request:/.test(s)
        );
      }

      function reasoningIsLowSignal(text) {
        let s = (text || '').trim();
        if (!s) return false;
        let lower = s.toLowerCase();
        let metaStart =
          /^(i need to|i should|let me|the user is asking|i will|first,? i need to|to answer this,? i need to)\b/u.test(
            lower,
          );
        if (metaStart && !s.includes('\n') && s.length <= 320) return true;
        if (s.length > 140 || s.includes('\n') || /[0-9]/.test(s) || /[-*`]/.test(s)) return false;
        let exactPatterns = [
          /^i need to complete the response\.?$/u,
          /^i need to continue the response\.?$/u,
          /^i need to finish the response\.?$/u,
          /^i need to answer the question\.?$/u,
          /^i need to provide the answer\.?$/u,
          /^i should answer directly\.?$/u,
          /^let me think\.?$/u,
        ];
        if (exactPatterns.some((re) => re.test(lower))) return true;
        return (
          /^(i need to|i should|let me|the user is asking|i will)\b/u.test(lower) &&
          /\b(response|answer|question|reply|respond|continue|complete|finish|provide)\b/u.test(
            lower,
          )
        );
      }

      function reasoningLooksLikeAnswer(text) {
        let s = (text || '').trim();
        if (s.length < 120) return false;
        if (hasStructuredReasoning(s) || looksLikePlainReasoning(s)) return false;
        if (/\b(i need|i should|let me|check|compare|verify|inspect|plan|think)\b/iu.test(s))
          return false;
        let sentences = s
          .split(/[.!?](?:\s+|$)/u)
          .map((part) => part.trim())
          .filter(Boolean);
        if (sentences.length < 2) return false;
        return /^[A-Z]/u.test(s);
      }

      function normalizeReasoningText(text) {
        return (text || '').toLowerCase().replace(/\s+/gu, ' ').trim();
      }

      function sharedPrefixLen(a, b) {
        let limit = Math.min(a.length, b.length);
        let i = 0;
        while (i < limit && a.charCodeAt(i) === b.charCodeAt(i)) i++;
        return i;
      }

      function reasoningDuplicatesAnswer(reasoning, answer) {
        let r = normalizeReasoningText(reasoning);
        let a = normalizeReasoningText(answer);
        if (!r || !a) return false;
        if (r === a) return true;
        let shorter = Math.min(r.length, a.length);
        if (shorter >= 80 && (r.includes(a) || a.includes(r))) return true;
        let prefix = sharedPrefixLen(r, a);
        // Early streaming detection: if the entire answer so far matches the reasoning start
        if (a.length >= 40 && r.length > a.length && r.startsWith(a)) return true;
        return prefix >= 120 && prefix / shorter >= 0.6;
      }

      function normalizeDisplayView(view) {
        if (!view || !view.showReasoning) return view;
        const reasoning = (view.reasoning || '').trim();
        if (!reasoning && !view.isThinking)
          return { ...view, reasoning: '', showReasoning: false, suppressedReasoning: true };
        // Model-provided reasoning remains available throughout the response. Never
        // replace a separate answer based on the length or wording of its reasoning.
        if (
          reasoning &&
          !view.isThinking &&
          !view.answer &&
          reasoning.length >= 80 &&
          !reasoningIsLowSignal(reasoning) &&
          !looksLikeGenuineReasoning(reasoning)
        ) {
          return { ...view, answer: reasoning, promotedReasoning: true };
        }
        return view;
      }

      function splitDisplayContent(raw, isThinking) {
        let text = raw || '';
        // Extract the model's reasoning before cleaning the answer. Applying the
        // answer-only planning filter to this envelope can erase reasoning mid-turn.
        let thinkMatch = text.match(/<think>([\s\S]*?)<\/think>/);
        let thinkPartial = !thinkMatch && text.match(/<think>([\s\S]*)$/);
        let implicitThinkClose =
          !thinkMatch && !thinkPartial && text.includes('</think>') && !text.includes('<think>');
        let answer = sanitizeAnswerTail(
          text
            .replace(/<think>[\s\S]*?<\/think>\s*/g, '')
            .replace(/<think>[\s\S]*$/, '')
            .trim(),
        );
        if (thinkMatch || thinkPartial) {
          return {
            reasoning: (thinkMatch ? thinkMatch[1] : thinkPartial ? thinkPartial[1] : '').trim(),
            answer,
            showReasoning: true,
            isThinking,
          };
        }
        if (implicitThinkClose) {
          let parts = text.split('</think>');
          return {
            reasoning: stripTrailingArtifacts((parts[0] || '').trim()),
            answer: sanitizeAnswerTail(parts.slice(1).join('</think>').trim()),
            showReasoning: true,
            isThinking: false,
          };
        }
        let trimmed = sanitizeAnswerTail(text.trim());
        if (looksLikePlainReasoning(trimmed)) {
          if (!isThinking) {
            return {
              reasoning: trimmed,
              answer: trimmed,
              showReasoning: true,
              isThinking: false,
              promotedReasoning: true,
            };
          }
          return {
            reasoning: trimmed,
            answer: '',
            showReasoning: true,
            isThinking: true,
          };
        }
        return {
          reasoning: '',
          answer: trimmed,
          showReasoning: false,
          isThinking: false,
        };
      }

      function addMsg(role, text) {
        let w = document.getElementById('w');
        if (w) w.remove();
        let d = document.createElement('div');
        d.className = 'msg ' + (role === 'user' ? 'u' : 'a');
        const avatar =
          role === 'user'
            ? '<div class="av" aria-hidden="true">U</div>'
            : '<div class="av" role="img" aria-label="ZINC"></div>';
        d.innerHTML = avatar + '<div class="bbl"></div>';
        let bbl = d.querySelector('.bbl');
        if (role === 'user') {
          bbl.textContent = text || '';
        } else {
          bbl.innerHTML = text ? md(text) : '';
        }
        M.appendChild(d);
        M.scrollTop = M.scrollHeight;
        return bbl;
      }

      function clearConversation() {
        if (isGenerating || modelActionPending) return;
        let oldSessionId = chatSessionId;
        I.value = '';
        I.style.height = 'auto';
        removeStorage(chatStateKey);
        resetConversation();
        userScrolledUp = false;
        updateJumpButton();
        updateComposerState();
        SS.textContent = 'conversation cleared';
        I.focus();
        // Native backends do not advertise session reuse or expose this route.
        if (!supportsChatSessionReset || !oldSessionId) return;
        fetch(base + '/chat/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: oldSessionId }),
        })
          .then(() => scheduleHealthRefresh(0))
          .catch(() => {});
      }

      async function send() {
        if (isGenerating) {
          stopGeneration();
          return;
        }
        if (modelActionPending || (modelsReady && !activeModel())) return;
        let t = I.value.trim();
        if (!t) return;
        I.value = '';
        I.style.height = 'auto';
        userScrolledUp = false;
        addMsg('user', t);
        H.push({ role: 'user', content: t });
        saveChatState();
        let bbl = addMsg('assistant', '');
        bbl.classList.add('streaming');
        let liveMeta = document.createElement('div');
        liveMeta.className = 'meta';
        liveMeta.textContent = 'generating...';
        bbl.parentElement.appendChild(liveMeta);
        let cur = document.createElement('span');
        cur.className = 'cursor';
        bbl.appendChild(cur);
        let raw = '',
          tokens = 0,
          t0 = performance.now(),
          thinking = false,
          stopped = false,
          draftEntry = null,
          finishReason = 'stop';
        let selectedModelId = 'zinc';
        let enableThinking = false;
        let supportsThinkingForHistory = false;
        let requestMessages = [];
        let errorMessage = '';
        let mtpResult = null;
        let displayStopped = false;
        const requestMtpSetting = mtpRequestSetting();
        let sawFinishReason = false;
        let receivedStreamData = false;
        let stallTimer = null;
        function clearStallTimer() {
          if (stallTimer !== null) {
            clearTimeout(stallTimer);
            stallTimer = null;
          }
        }
        function armStallTimer() {
          clearStallTimer();
          stallTimer = setTimeout(
            () => {
              if (!activeController || stopRequested || errorMessage) return;
              errorMessage =
                'Response timed out while waiting for the server. Try a shorter message or retry.';
              activeController.abort();
            },
            receivedStreamData ? 120000 : 600000,
          );
        }
        activeController = new AbortController();
        stopRequested = false;
        setGenerating(true);
        try {
          let currentModel = activeModel();
          selectedModelId = currentModel?.id || MN.textContent || 'zinc';
          enableThinking = activeModelSupportsThinking() && TH.checked;
          supportsThinkingForHistory = !!currentModel?.supports_thinking_toggle;
          let maxTokens = chatMaxTokens(enableThinking);
          thinking = enableThinking;
          requestMessages = requestMessagesFromHistory(supportsThinkingForHistory);
          // A large GPU prefill can take several minutes before the first byte.
          // Stop remains available throughout; streaming gets a shorter idle limit.
          armStallTimer();
          let r = await fetch(base + '/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: selectedModelId,
              session_id: chatSessionId,
              messages: requestMessages,
              stream: true,
              max_tokens: maxTokens,
              temperature: 1.0,
              enable_thinking: enableThinking,
              ...(requestMtpSetting !== undefined ? { enable_mtp: requestMtpSetting } : {}),
            }),
            signal: activeController.signal,
          });
          if (!r.ok) {
            let e = await r.json().catch(() => ({}));
            throw new Error(e.error?.message || r.statusText);
          }
          if (!r.body) throw new Error('Streaming response missing body');
          armStallTimer();
          let rd = r.body.getReader(),
            dc = new TextDecoder(),
            buf = '';
          stream: while (true) {
            let { done, value } = await rd.read();
            if (done) break;
            if (value.byteLength > 0) receivedStreamData = true;
            armStallTimer();
            buf += dc.decode(value, { stream: true });
            let ls = buf.split('\n');
            buf = ls.pop() || '';
            for (let l of ls) {
              if (!l.startsWith('data: ')) continue;
              let p = l.slice(6);
              if (p === '[DONE]') break stream;
              try {
                const event = JSON.parse(p);
                const reportedMtp = normalizeMtpResult(event.mtp);
                if (reportedMtp) mtpResult = reportedMtp;
                if (event.error) {
                  errorMessage = event.error.message || 'Generation failed';
                  finishReason = 'error';
                  sawFinishReason = true;
                  try {
                    await rd.cancel();
                  } catch (_e) {}
                  break stream;
                }
                let choice = event.choices?.[0];
                if (choice?.finish_reason) {
                  finishReason = choice.finish_reason;
                  sawFinishReason = true;
                }
                let c = choice?.delta?.content;
                if (c && !displayStopped) {
                  tokens++;
                  let sawInlineStop = hasInlineStopArtifact(c);
                  const chunkStopIndex = findInlineStopArtifactStart(c);
                  let cleanChunk = stripInlineTransportArtifacts(
                    chunkStopIndex === -1 ? c : c.slice(0, chunkStopIndex),
                  );
                  if (!cleanChunk) {
                    if (sawInlineStop) {
                      finishReason = 'stop';
                      sawFinishReason = true;
                      displayStopped = true;
                    }
                    continue;
                  }
                  armStallTimer();
                  raw += cleanChunk;
                  let reopenedThinkIdx = findUnexpectedThinkingTailStart(raw);
                  if (reopenedThinkIdx !== -1) {
                    raw = raw.slice(0, reopenedThinkIdx).replace(/\s+$/u, '');
                    if (raw && !draftEntry) {
                      draftEntry = {
                        role: 'assistant',
                        content: '',
                        raw: '',
                        transport: '',
                        partial: true,
                      };
                      H.push(draftEntry);
                    }
                    let rendered = assistantLiveHtmlFromRaw(raw, false);
                    if (draftEntry) {
                      draftEntry.raw = raw;
                      draftEntry.content = rendered.view.answer || stripTrailingArtifacts(raw);
                      draftEntry.transport = '';
                      scheduleChatStateSave(600);
                    }
                    flushPendingRender();
                    updateLiveAssistant(bbl, raw, false, cur);
                    finishReason = 'stop';
                    sawFinishReason = true;
                    try {
                      rd.cancel();
                    } catch (_e) {}
                    break stream;
                  }
                  let inlineStopIdx = findInlineStopArtifactStart(raw);
                  if (inlineStopIdx !== -1) {
                    raw = raw.slice(0, inlineStopIdx);
                    if (raw && !draftEntry) {
                      draftEntry = {
                        role: 'assistant',
                        content: '',
                        raw: '',
                        transport: '',
                        partial: true,
                      };
                      H.push(draftEntry);
                    }
                    let rendered = assistantLiveHtmlFromRaw(raw, false);
                    if (draftEntry) {
                      draftEntry.raw = raw;
                      draftEntry.content = rendered.view.answer || stripTrailingArtifacts(raw);
                      draftEntry.transport = '';
                      scheduleChatStateSave(600);
                    }
                    flushPendingRender();
                    updateLiveAssistant(bbl, raw, false, cur);
                    finishReason = 'stop';
                    sawFinishReason = true;
                    displayStopped = true;
                    continue;
                  }
                  // Track <think>...</think> reasoning blocks
                  if (!thinking && raw.includes('<think>')) {
                    thinking = true;
                  }
                  if (thinking && raw.includes('</think>')) {
                    thinking = false;
                  }
                  if (!draftEntry) {
                    draftEntry = {
                      role: 'assistant',
                      content: '',
                      raw: '',
                      transport: '',
                      partial: true,
                    };
                    H.push(draftEntry);
                  }
                  draftEntry.raw = raw;
                  draftEntry.transport = '';
                  let visibleAnswer =
                    splitDisplayContent(raw, thinking).answer || stripTrailingArtifacts(raw);
                  scheduleRender(function () {
                    let view = updateLiveAssistant(bbl, raw, thinking, cur);
                    draftEntry.content = view.answer || stripTrailingArtifacts(raw);
                    scheduleChatStateSave(600);
                    let elapsed = (performance.now() - t0) / 1000;
                    if (elapsed > 0.3) {
                      let tps = (tokens / elapsed).toFixed(1);
                      SS.textContent = tps + ' tok/s · generating';
                      liveMeta.textContent = tokens + ' tokens · ' + tps + ' tok/s · generating';
                    }
                  });
                  if (!sawInlineStop && findRestartedAnswerStart(visibleAnswer) !== -1) {
                    errorMessage = 'Response started repeating itself and was stopped early.';
                    activeController.abort();
                    break stream;
                  }
                  if (
                    !sawInlineStop &&
                    (looksLikeRepeatedParagraphLoop(visibleAnswer) || hasRepeatedPhraseLoop(raw))
                  ) {
                    errorMessage = 'Response started looping and was stopped early.';
                    activeController.abort();
                    break stream;
                  }
                  if (sawInlineStop) {
                    finishReason = 'stop';
                    sawFinishReason = true;
                    // Stop displaying content, but read the terminal execution facts.
                    displayStopped = true;
                  }
                }
              } catch (e) {}
            }
          }
        } catch (e) {
          if (stopRequested) {
            stopped = true;
          } else if (e.name === 'AbortError' && !errorMessage) {
            stopped = true;
          } else errorMessage = errorMessage || e?.message || 'Request failed';
        }
        clearStallTimer();
        flushPendingRender();
        let liveReasoningOpen = bbl.querySelector('.reasoning-block')?.open;
        if (cur.parentNode) cur.remove();
        bbl.classList.remove('streaming');
        highlightAll();
        let finalView = normalizeDisplayView(splitDisplayContent(raw, false));
        let cleanAnswer = finalView.answer;
        let finalRendered = assistantHtmlFromRaw(raw, false);
        let hadOutput = !!stripTrailingArtifacts(raw).trim();
        let missingFinishReason = !stopped && !errorMessage && !sawFinishReason;
        if (
          !stopped &&
          enableThinking &&
          finishReason === 'length' &&
          !cleanAnswer &&
          finalView.showReasoning
        ) {
          try {
            // Recovery is still part of this turn: keep the composer/model controls
            // locked until it completes, and keep Stop/Escape connected to its fetch.
            activeController = new AbortController();
            receivedStreamData = false;
            SS.textContent = 'recovering final answer...';
            const status = document.getElementById('composer-status');
            if (status) status.textContent = 'Preparing the final answer. Press Escape to stop.';
            armStallTimer();
            let recovered = await fetchRecoveredAnswer(
              selectedModelId,
              requestMessages,
              activeController.signal,
              requestMtpSetting,
            );
            if (recovered.mtp) mtpResult = recovered.mtp;
            if (recovered.content) {
              raw = raw + (raw.endsWith('\n') ? '' : '\n') + '</think>\n' + recovered.content;
              finalView = normalizeDisplayView(splitDisplayContent(raw, false));
              cleanAnswer = finalView.answer;
              finalRendered = assistantHtmlFromRaw(raw, false);
              finishReason = recovered.finishReason || 'stop';
              sawFinishReason = true;
              missingFinishReason = false;
              hadOutput = !!stripTrailingArtifacts(raw).trim();
            }
          } catch (error) {
            if (stopRequested) stopped = true;
            else
              errorMessage =
                errorMessage || error?.message || 'Could not complete the final answer.';
          }
          clearStallTimer();
        }
        liveReasoningOpen = bbl.querySelector('.reasoning-block')?.open ?? liveReasoningOpen;
        activeController = null;
        stopRequested = false;
        setGenerating(false);
        if (document.activeElement === I || document.activeElement === B)
          I.focus({ preventScroll: true });
        let notice = stopped
          ? null
          : completionNotice({
              hasAnswer: !!cleanAnswer,
              finishReason,
              errorMessage,
              missingFinishReason,
              showReasoning: finalView.showReasoning,
              suppressedReasoning: finalView.suppressedReasoning === true,
              hadOutput,
            });
        let incomplete = stopped || !!notice;
        if (draftEntry) {
          if (mtpResult) draftEntry.mtp = mtpResult;
          if (typeof liveReasoningOpen === 'boolean') draftEntry.reasoning_open = liveReasoningOpen;
          if (cleanAnswer) {
            draftEntry.content = cleanAnswer;
            draftEntry.transport = historyTransportContent(
              cleanAnswer,
              raw,
              enableThinking,
              supportsThinkingForHistory,
            );
            draftEntry.raw = raw;
            delete draftEntry.partial;
            persistAssistantNotice(draftEntry, notice, incomplete);
            if (!incomplete && !finalView.showReasoning) delete draftEntry.raw;
          } else if (raw.trim()) {
            let incompleteNotice = notice || {
              kind: 'warn',
              title: 'Incomplete response',
              message: 'The reply ended before it was complete.',
            };
            draftEntry.content = finalView.reasoning || stripTrailingArtifacts(raw);
            draftEntry.transport = '';
            draftEntry.raw = raw;
            delete draftEntry.partial;
            persistAssistantNotice(draftEntry, incompleteNotice, true);
          } else {
            H = H.filter((m) => m !== draftEntry);
          }
          saveChatState();
        }
        if (stopped) {
          if (cleanAnswer) {
            completeAssistantHtml(bbl, finalRendered.html || md(cleanAnswer), liveReasoningOpen);
            bbl.insertAdjacentHTML(
              'beforeend',
              renderAssistantNotice(
                'warn',
                'Generation stopped',
                'Stopped before the reply finished.',
              ),
            );
            highlightAll();
          } else {
            completeAssistantHtml(
              bbl,
              finalRendered.html +
                renderAssistantNotice(
                  'warn',
                  'Generation stopped',
                  'Stopped before any final answer was returned.',
                ),
              liveReasoningOpen,
            );
          }
          let el = (performance.now() - t0) / 1000;
          if (cleanAnswer) {
            SS.textContent = tokens + ' tokens \u00b7 stopped';
            liveMeta.textContent = tokens + ' tokens \u00b7 stopped \u00b7 ' + el.toFixed(1) + 's';
          } else {
            SS.textContent = 'stopped';
            liveMeta.textContent = 'stopped \u00b7 ' + el.toFixed(1) + 's';
          }
          showMtpResult(mtpResult, liveMeta);
          if (draftEntry) bindReasoningState(bbl, draftEntry);
          return;
        }
        if (!cleanAnswer && notice) {
          let body = '';
          if (finalView.showReasoning) body += renderReasoning(finalView.reasoning, false);
          body += renderAssistantNotice(notice.kind, notice.title, notice.message);
          completeAssistantHtml(bbl, body, liveReasoningOpen);
          highlightAll();
          SS.textContent = notice.kind === 'error' ? 'request failed' : 'incomplete response';
          let el = (performance.now() - t0) / 1000;
          liveMeta.textContent =
            (tokens ? tokens + ' tokens \u00b7 ' : '') +
            el.toFixed(1) +
            's \u00b7 ' +
            notice.title.toLowerCase();
        } else if (cleanAnswer) {
          if (finalRendered.html) {
            completeAssistantHtml(bbl, finalRendered.html, liveReasoningOpen);
            highlightAll();
          }
          if (notice) {
            bbl.insertAdjacentHTML(
              'beforeend',
              renderAssistantNotice(notice.kind, notice.title, notice.message),
            );
          }
          let el = (performance.now() - t0) / 1000,
            tps = tokens / el;
          let statusSuffix = '';
          if (notice)
            statusSuffix = notice.kind === 'error' ? ' \u00b7 interrupted' : ' \u00b7 incomplete';
          SS.textContent = tokens + ' tokens \u00b7 ' + tps.toFixed(1) + ' tok/s' + statusSuffix;
          liveMeta.textContent =
            tokens +
            ' tokens \u00b7 ' +
            tps.toFixed(1) +
            ' tok/s \u00b7 ' +
            el.toFixed(1) +
            's' +
            (notice ? ' \u00b7 ' + notice.title.toLowerCase() : '');
        } else {
          let fallbackNotice =
            notice ||
            completionNotice({
              hasAnswer: false,
              finishReason,
              errorMessage,
              missingFinishReason,
              showReasoning: false,
              hadOutput: false,
            });
          bbl.innerHTML = renderAssistantNotice(
            fallbackNotice.kind,
            fallbackNotice.title,
            fallbackNotice.message,
          );
          SS.textContent = fallbackNotice.kind === 'error' ? 'request failed' : 'empty response';
          liveMeta.textContent = fallbackNotice.title.toLowerCase();
        }
        showMtpResult(mtpResult, liveMeta);
        if (draftEntry) bindReasoningState(bbl, draftEntry);
        saveChatState();
      }

      async function copyCode(btn) {
        const pre = btn.closest('.code-block').querySelector('code');
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
          await navigator.clipboard.writeText(pre.textContent);
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
        } catch (error) {
          btn.textContent = 'Couldn’t copy';
          btn.title = 'Select the code and copy it manually';
        }
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.title = '';
          btn.classList.remove('copied');
        }, 1800);
      }
      // Zig is not bundled with highlight.js's common browser build. Keep its small
      // lexer local so code remains colored even without an internet connection.
      function highlightZigCode(source) {
        const keywords = new Set(
          'addrspace align allowzero and asm async await break callconv catch comptime const continue defer else enum errdefer error export extern fn for if inline linksection noalias noinline nosuspend opaque or orelse packed pub resume return section struct suspend switch test threadlocal try union unreachable usingnamespace var volatile while'.split(
            ' ',
          ),
        );
        const types = new Set(
          'anyerror anyframe anyopaque anytype bool c_char c_int c_long c_longdouble c_longlong c_short c_uint c_ulong c_ulonglong c_ushort comptime_float comptime_int isize noreturn type usize void'.split(
            ' ',
          ),
        );
        const literals = new Set(['true', 'false', 'null', 'undefined']);
        const tokens =
          /\/\/[^\r\n]*|\\\\[^\r\n]*|@"(?:\\.|[^"\\\r\n])*"?|"(?:\\.|[^"\\\r\n])*"?|'(?:\\(?:u\{[0-9a-fA-F]+\}|x[0-9a-fA-F]{2}|.)|[^'\\\r\n])'|@[A-Za-z_]\w*|\b0x[\da-fA-F][\da-fA-F_]*(?:\.[\da-fA-F_]+)?(?:[pP][+-]?\d[\d_]*)?\b|\b0b[01][01_]*\b|\b0o[0-7][0-7_]*\b|\b\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d[\d_]*)?\b|\.[A-Za-z_]\w*|[A-Za-z_]\w*/g;
        let html = '',
          end = 0;
        for (const match of source.matchAll(tokens)) {
          const token = match[0];
          html += esc(source.slice(end, match.index));
          let scope = '';
          if (token.startsWith('//')) scope = 'comment';
          else if (token.startsWith('\\\\') || token[0] === '"' || token[0] === "'")
            scope = 'string';
          else if (token[0] === '@' && token[1] !== '"') scope = 'built_in';
          else if (/^\d/.test(token)) scope = 'number';
          else if (keywords.has(token)) scope = 'keyword';
          else if (types.has(token) || /^(?:[iu]\d+|f(?:16|32|64|80|128))$/.test(token))
            scope = 'type';
          else if (literals.has(token)) scope = 'literal';
          else if (token[0] === '.' && !/[\w.]/.test(source[match.index - 1] || ''))
            scope = 'symbol';
          else if (token[0] !== '@' && /^\s*\(/.test(source.slice(match.index + token.length)))
            scope = 'title function_';
          html += scope ? '<span class="hljs-' + scope + '">' + esc(token) + '</span>' : esc(token);
          end = match.index + token.length;
        }
        return html + esc(source.slice(end));
      }

      function highlightAll(scope = document) {
        const blocks = scope.querySelectorAll('pre code[class*="language-"]');
        let needsLibrary = false;
        blocks.forEach((el) => {
          if (el.dataset.highlighted) return;
          // A streamed fence is highlighted once it is complete and committed, not
          // on every token while the current Markdown tail is changing.
          if (el.closest?.('.markdown-tail') && el.closest?.('.streaming')) return;
          const language = (
            el.className.match(/(?:^|\s)language-([^\s]+)/)?.[1] || 'plaintext'
          ).toLowerCase();
          if (language === 'zig' || language === 'ziglang') {
            el.innerHTML = highlightZigCode(el.textContent);
            el.classList.add('hljs');
            el.dataset.highlighted = 'yes';
            return;
          }
          if (language === 'plaintext' || language === 'text' || language === 'txt') return;
          if (typeof hljs === 'undefined') {
            needsLibrary = true;
            return;
          }
          if (typeof hljs.getLanguage === 'function' && !hljs.getLanguage(language)) return;
          try {
            hljs.highlightElement(el);
          } catch (error) {}
        });
        if (!needsLibrary || highlightAll.loading || !document.head) return;
        // The optional common-language bundle never blocks the first page render.
        // Loading/failure is recorded once, avoiding duplicate requests and retries.
        highlightAll.loading = true;
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
        script.async = true;
        script.onload = () => highlightAll();
        script.onerror = () => {
          highlightAll.failed = true;
        };
        document.head.appendChild(script);
      }
      TH.addEventListener('change', () => {
        chatPrefs.thinkingEnabled = TH.checked;
        saveChatPrefs();
        updateThinkingUi();
        updateMtpUi();
      });
      const mtpInput = document.getElementById('mtp');
      if (mtpInput)
        mtpInput.addEventListener('change', () => {
          if (currentMtpCapability().mtp_request_control !== true || !activeModelSupportsMtp()) {
            updateMtpUi();
            return;
          }
          chatPrefs.mtpPreference = mtpInput.checked ? 'on' : 'off';
          saveChatPrefs();
          updateMtpUi();
        });
      const mtpReset = document.getElementById('mtp-reset');
      if (mtpReset)
        mtpReset.addEventListener('click', () => {
          chatPrefs.mtpPreference = 'auto';
          saveChatPrefs();
          updateMtpUi();
        });
      MS.addEventListener('change', () => {
        updateDownloadUi();
        updateModelAction();
        const model = selectedModel();
        if (model?.installed && !model.active && modelCanLoad(model)) performModelAction(model);
      });
      CB.addEventListener('click', clearConversation);
      // Another tab changed the shared chat state (e.g. cleared it): adopt it, so this tab's
      // stale in-memory history is not written back over the other tab's clear.
      if (typeof window !== 'undefined')
        window.addEventListener('storage', (e) => {
          if (e.key !== chatStateKey || isGenerating) return;
          restoreChatState();
        });
      if (typeof window !== 'undefined') window.addEventListener('pagehide', saveChatState);
      if (typeof window !== 'undefined')
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && isGenerating && !e.defaultPrevented && !e.isComposing) {
            e.preventDefault();
            stopGeneration();
          }
        });
      const jumpLatest = document.getElementById('jump-latest');
      if (jumpLatest)
        jumpLatest.addEventListener('click', () => {
          userScrolledUp = false;
          autoScroll();
        });
      M.addEventListener('click', (e) => {
        const prompt = e.target.closest?.('[data-prompt]');
        if (!prompt || isGenerating) return;
        I.value = prompt.getAttribute('data-prompt') || '';
        resizeComposer();
        updateComposerState();
        scheduleChatStateSave();
        I.focus();
      });
      MB.addEventListener('click', () => {
        let model = selectedModel();
        if (model?.active) {
          unloadModel();
          return;
        }
        if (model && !model.downloading && model.download_phase !== 'verifying')
          performModelAction(model);
      });
      function resizeComposer() {
        I.style.height = 'auto';
        I.style.height = Math.min(I.scrollHeight, 180) + 'px';
      }
      I.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Escape' && isGenerating) {
          e.preventDefault();
          stopGeneration();
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey && !isGenerating) {
          e.preventDefault();
          send();
        }
      });
      I.addEventListener('input', function () {
        resizeComposer();
        updateComposerState();
        scheduleChatStateSave();
      });
      init();
      setGenerating(false);
      I.focus();
    </script>
