<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Past the twelve-agent knee, an unbounded queue turns every added agent into pure waiting; admission control bounds it by shedding</title>
<desc id="dsc">A line chart on a dark plum background. The horizontal axis is the number of concurrent coding agents from 8 to 24 on one RX 9070 XT with eight decode slots. The vertical axis is the 99th-percentile queue wait in seconds before a turn starts decoding, from 0 to 30. A vertical guide marks the saturation knee at twelve agents, where measured goodput plateaus at 0.88 turns per second. The cyan curve is an unbounded queue: its p99 wait climbs almost linearly from about 9 seconds at twelve agents to 27 seconds at twenty-four agents, even though goodput is already pinned. The gold curve is a fixed concurrency cap of twelve: its p99 wait stays flat near 12 seconds, but it defers a rising share of submissions, from 6 percent at fourteen agents to 37 percent at twenty-four. The coral curve is a delay-targeted CoDel-style policy with an 8 second target: its p99 wait tracks the unbounded curve until it starts binding, and it defers far less than the fixed cap, 23 percent versus 37 percent at twenty-four agents, for a wait only a few seconds longer.</desc>
<rect x="0" y="0" width="1120" height="600" rx="14" fill="#1b1426"/>
<text x="34" y="42" fill="#f3ecff" font-size="21" font-weight="700">Past the knee, an unbounded queue is pure waiting; admission control trades it for deferral</text>
<text x="34" y="66" fill="#b3a2c9" font-size="12.5">One RX 9070 XT: 8 decode slots, ~39 tok/s per slot, mean turn 354 tokens, agent think ~4.5 s. Goodput plateaus at 0.88 turns/s past N=12; the y-axis is the wait before a turn starts.</text>
