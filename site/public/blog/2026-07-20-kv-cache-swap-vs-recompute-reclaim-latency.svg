<text x="358.4" y="420.0" text-anchor="middle" class="tick">10 ms</text>
<line x1="548.8" y1="392.0" x2="548.8" y2="400.0" stroke="#4a4330" stroke-width="1.4"/>
<text x="548.8" y="420.0" text-anchor="middle" class="tick">100 ms</text>
<line x1="739.2" y1="392.0" x2="739.2" y2="400.0" stroke="#4a4330" stroke-width="1.4"/>
<text x="739.2" y="420.0" text-anchor="middle" class="tick">1 s</text>
<line x1="929.6" y1="392.0" x2="929.6" y2="400.0" stroke="#4a4330" stroke-width="1.4"/>
<text x="929.6" y="420.0" text-anchor="middle" class="tick">10 s</text>
