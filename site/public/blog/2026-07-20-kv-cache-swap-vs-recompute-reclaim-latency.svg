<text x="168.0" y="444.0" text-anchor="start" class="labs">log scale. Every gridline step to the right is ten times longer.</text>
<line x1="474.3" y1="240" x2="474.3" y2="392.0" stroke="#fb7185" stroke-width="3.2"/>
<circle cx="474.3" cy="240" r="7" fill="#fb7185"/>
<text x="460.3" y="268" text-anchor="end" class="roseb">41 ms</text>
<text x="460.3" y="288" text-anchor="end" class="rose">swap out + swap back</text>
<text x="460.3" y="306" text-anchor="end" class="labs">1.01 GB each way over PCIe 5.0 x16</text>
<text x="460.3" y="323" text-anchor="end" class="labs">host RAM keeps the tokens verbatim</text>
<line x1="902.1" y1="240" x2="902.1" y2="392.0" stroke="#a3e635" stroke-width="3.2"/>
<circle cx="902.1" cy="240" r="7" fill="#a3e635"/>
<text x="888.1" y="268" text-anchor="end" class="limeb">7.2 s</text>
<text x="888.1" y="288" text-anchor="end" class="lime">recompute from the prompt</text>
<text x="888.1" y="306" text-anchor="end" class="labs">6,900 tokens of prefill at 962 tok/s</text>
<text x="888.1" y="323" text-anchor="end" class="labs">vLLM V1&#8217;s default preemption mode</text>
<line x1="478.3" y1="356" x2="898.1" y2="356" stroke="#8f8770" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="688.2" y="349" text-anchor="middle" class="lab">177x</text>
<rect x="56" y="476" width="1088" height="246" rx="12" fill="#1d1a12" stroke="#332e1f"/>
<text x="86" y="510" class="hd">And host RAM is the larger tier</text>
<rect x="300.0" y="536" width="136.0" height="46" rx="6" fill="url(#vram)"/>
<text x="284.0" y="558" text-anchor="end" class="lab">on the card</text>
<text x="284.0" y="576" text-anchor="end" class="labs">8.1 GB of VRAM left after weights</text>
<text x="450.0" y="566" class="big">55,000 tokens</text>
<rect x="300.0" y="606" width="806.0" height="46" rx="6" fill="url(#host)"/>
<text x="284.0" y="628" text-anchor="end" class="lab">in host DDR5</text>
<text x="284.0" y="646" text-anchor="end" class="labs">48 GB pinned out of a 96 GB kit</text>
<text x="318.0" y="636" class="big" fill="#17150e">326,000 tokens</text>
<text x="86" y="690" class="note">At 147 KB per fp16 KV token, the DDR5 already in this machine holds six times the KV cache the card can. It is one PCIe hop away,</text>
<text x="86" y="710" class="note">and today ZINC uses none of it: an agent that stops to run a shell command keeps its full gigabyte resident in VRAM until it comes back.</text>
</svg>