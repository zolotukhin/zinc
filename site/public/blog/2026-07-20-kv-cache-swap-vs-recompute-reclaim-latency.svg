<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17150e"/><stop offset="1" stop-color="#211d14"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c76a" stop-opacity="0.16"/><stop offset="1" stop-color="#e8c76a" stop-opacity="0.03"/></linearGradient>
<linearGradient id="vram" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e0566c"/></linearGradient>
<linearGradient id="host" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#7fbe22"/></linearGradient>
<style>.title{fill:#f6f1e4;font-size:25px;font-weight:780}.sub{fill:#a9a186;font-size:14px}.tick{fill:#8f8770;font-size:12.5px}.rose{fill:#fb7185;font-size:13px;font-weight:740}.roseb{fill:#fb7185;font-size:20px;font-weight:800}.lime{fill:#a3e635;font-size:13px;font-weight:740}.limeb{fill:#a3e635;font-size:20px;font-weight:800}.gold{fill:#e8c76a;font-size:13px;font-weight:720}.lab{fill:#e6dfcd;font-size:13.5px;font-weight:660}.labs{fill:#a9a186;font-size:12px}.hd{fill:#f6f1e4;font-size:16px;font-weight:760}.big{fill:#f6f1e4;font-size:22px;font-weight:800}.note{fill:#ded6c2;font-size:13px;font-weight:620}</style>
</defs>
<rect width="1200" height="752" fill="url(#bg)"/>
<text x="56" y="52" class="title">Reclaiming an idle agent&#8217;s KV cache: 41 ms over PCIe, or 7.2 s of prefill</text>
<text x="56" y="78" class="sub">One agent holding 6,900 tokens of fp16 KV cache (1.01 GB) on an RX 9070 XT running Qwen3.5-9B Q4_K_M. Modeled, not measured.</text>
<text x="56" y="99" class="sub">Swap assumes 50 GB/s of pinned-memory copy over PCIe 5.0 x16, both directions. Recompute assumes ZINC&#8217;s measured 962 tok/s prefill.</text>
<rect x="56" y="124" width="1088" height="336" rx="12" fill="#1d1a12" stroke="#332e1f"/>
<text x="86" y="158" class="hd">How long it takes to get that gigabyte back</text>
<rect x="491.5" y="186" width="529.0" height="206.0" fill="url(#band)"/>
<line x1="491.5" y1="186" x2="491.5" y2="392.0" stroke="#e8c76a" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.75"/>
<line x1="1020.4" y1="186" x2="1020.4" y2="392.0" stroke="#e8c76a" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.75"/>
<text x="756.0" y="206" text-anchor="middle" class="gold">where an agent blocked on a tool call typically sits</text>
<text x="756.0" y="224" text-anchor="middle" class="labs">a file read, a grep, a test run, a web request: 50 ms to 30 s of no GPU work</text>
<line x1="168.0" y1="392.0" x2="1120.0" y2="392.0" stroke="#4a4330" stroke-width="1.6"/>
<line x1="168.0" y1="392.0" x2="168.0" y2="400.0" stroke="#4a4330" stroke-width="1.4"/>
