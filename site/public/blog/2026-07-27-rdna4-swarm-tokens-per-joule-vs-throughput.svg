<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1512"/><stop offset="1" stop-color="#14201b"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#12876a"/></linearGradient>
<linearGradient id="gapg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c76a" stop-opacity="0.22"/><stop offset="1" stop-color="#fb7185" stop-opacity="0.05"/></linearGradient>
<style>.title{fill:#f2f6f2;font-size:26px;font-weight:800}.sub{fill:#8fb3a4;font-size:14px}.tick{fill:#7f9c8e;font-size:12.5px}.hd{fill:#eaf3ee;font-size:16px;font-weight:760}.gold{fill:#e8c76a;font-size:13.5px;font-weight:740}.goldb{fill:#e8c76a;font-size:24px;font-weight:820}.rose{fill:#fb7185;font-size:13.5px;font-weight:740}.roseb{fill:#fb7185;font-size:24px;font-weight:820}.lab{fill:#d6e3db;font-size:13.5px;font-weight:640}.labs{fill:#8fb3a4;font-size:12px}.note{fill:#cfe0d7;font-size:13px;font-weight:620}.big{fill:#0d1512;font-size:13.5px;font-weight:800}</style>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<text x="56" y="54" class="title">Batching a swarm saves more time than energy</text>
<text x="56" y="80" class="sub">Qwen3.5-9B on one RX 9070 XT (304W, 640 GB/s). Both curves relative to the one-agent baseline. Modeled, not measured.</text>
<rect x="56" y="104" width="1088" height="372" rx="12" fill="#111d18" stroke="#20302a"/>
<text x="86" y="136" class="hd">Improvement over one agent: throughput pulls ahead of efficiency</text>
<line x1="320" y1="406.0" x2="1090" y2="406.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="410.0" text-anchor="end" class="tick">1&#215;</text>
<line x1="320" y1="360.0" x2="1090" y2="360.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="364.0" text-anchor="end" class="tick">2&#215;</text>
<line x1="320" y1="314.0" x2="1090" y2="314.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="318.0" text-anchor="end" class="tick">3&#215;</text>
<line x1="320" y1="268.0" x2="1090" y2="268.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="272.0" text-anchor="end" class="tick">4&#215;</text>
<line x1="320" y1="222.0" x2="1090" y2="222.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="226.0" text-anchor="end" class="tick">5&#215;</text>
<line x1="320" y1="176.0" x2="1090" y2="176.0" stroke="#1c2a24" stroke-width="1"/>
<text x="306" y="180.0" text-anchor="end" class="tick">6&#215;</text>
<line x1="320.0" y1="452.0" x2="320.0" y2="459.0" stroke="#2a3a33" stroke-width="1.3"/>
<text x="320.0" y="478.0" text-anchor="middle" class="tick">1 agent</text>
<line x1="576.7" y1="452.0" x2="576.7" y2="459.0" stroke="#2a3a33" stroke-width="1.3"/>
<text x="576.7" y="478.0" text-anchor="middle" class="tick">2 agents</text>
<line x1="833.3" y1="452.0" x2="833.3" y2="459.0" stroke="#2a3a33" stroke-width="1.3"/>
<text x="833.3" y="478.0" text-anchor="middle" class="tick">4 agents</text>
<line x1="1090.0" y1="452.0" x2="1090.0" y2="459.0" stroke="#2a3a33" stroke-width="1.3"/>
<text x="1090.0" y="478.0" text-anchor="middle" class="tick">8 agents</text>
<path d="M 320.0 406.0 L 576.7 366.0 L 833.3 298.7 L 1090.0 194.1 L 1090.0 280.6 L 833.3 325.8 L 576.7 371.8 L 320.0 406.0 Z" fill="url(#gapg)"/>
<path d="M 320.0 406.0 L 576.7 366.0 L 833.3 298.7 L 1090.0 194.1" fill="none" stroke="#e8c76a" stroke-width="3.4"/>
<circle cx="320.0" cy="406.0" r="5.2" fill="#e8c76a"/>
<circle cx="576.7" cy="366.0" r="5.2" fill="#e8c76a"/>
<circle cx="833.3" cy="298.7" r="5.2" fill="#e8c76a"/>
<circle cx="1090.0" cy="194.1" r="5.2" fill="#e8c76a"/>
<text x="576.7" y="353.0" text-anchor="middle" class="gold">74 tok/s</text>
<text x="833.3" y="285.7" text-anchor="middle" class="gold">132 tok/s</text>
<text x="1090.0" y="181.1" text-anchor="middle" class="gold">222 tok/s</text>
<path d="M 320.0 406.0 L 576.7 371.8 L 833.3 325.8 L 1090.0 280.6" fill="none" stroke="#fb7185" stroke-width="3.4"/>
<circle cx="320.0" cy="406.0" r="5.2" fill="#fb7185"/>
<circle cx="576.7" cy="371.8" r="5.2" fill="#fb7185"/>
<circle cx="833.3" cy="325.8" r="5.2" fill="#fb7185"/>
<circle cx="1090.0" cy="280.6" r="5.2" fill="#fb7185"/>
<text x="576.7" y="397.8" text-anchor="middle" class="rose">2.03 J/tok</text>
<text x="833.3" y="351.8" text-anchor="middle" class="rose">1.29 J/tok</text>
<text x="1090.0" y="306.6" text-anchor="middle" class="rose">0.95 J/tok</text>
<text x="314.0" y="390.0" text-anchor="middle" class="labs">both 1&#215;</text>
<text x="314.0" y="404.0" text-anchor="middle" class="labs">(39.6 tok/s, 3.5 J/tok)</text>
<text x="1076.0" y="191.9" text-anchor="end" class="goldb">5.6&#215;</text>
<text x="1076.0" y="288.4" text-anchor="end" class="roseb">3.7&#215;</text>
<text x="1090.0" y="159.9" text-anchor="end" class="gold">throughput</text>
<text x="576.7" y="387.6" text-anchor="middle" class="rose">tokens per joule</text>
<text x="705.0" y="251.9" text-anchor="middle" class="labs">the shaded gap is the efficiency win falling behind the throughput win</text>
<rect x="56" y="500" width="1088" height="278" rx="12" fill="#111d18" stroke="#20302a"/>
<text x="86" y="532" class="hd">Energy per token, split into the two costs batching moves in opposite directions</text>
<rect x="274.0" y="571.9" width="92" height="154.1" rx="4" fill="url(#floor)"/>
<text x="320.0" y="653.9" text-anchor="middle" class="big">3.28 J</text>
<rect x="274.0" y="560.0" width="92" height="11.9" rx="4" fill="#fb7185" opacity="0.92"/>
<text x="320.0" y="551.0" text-anchor="middle" class="rose">+0.25 J</text>
<text x="320.0" y="748.0" text-anchor="middle" class="tick">1 agent</text>
<rect x="530.7" y="643.5" width="92" height="82.5" rx="4" fill="url(#floor)"/>
<text x="576.7" y="689.8" text-anchor="middle" class="big">1.76 J</text>
<rect x="530.7" y="630.8" width="92" height="12.7" rx="4" fill="#fb7185" opacity="0.92"/>
<text x="576.7" y="621.8" text-anchor="middle" class="rose">+0.27 J</text>
<text x="576.7" y="748.0" text-anchor="middle" class="tick">2 agents</text>
<rect x="787.3" y="679.8" width="92" height="46.2" rx="4" fill="url(#floor)"/>
<text x="833.3" y="707.9" text-anchor="middle" class="big">0.98 J</text>
<rect x="787.3" y="665.5" width="92" height="14.2" rx="4" fill="#fb7185" opacity="0.92"/>
<text x="833.3" y="656.5" text-anchor="middle" class="rose">+0.30 J</text>
<text x="833.3" y="748.0" text-anchor="middle" class="tick">4 agents</text>
<rect x="1044.0" y="698.5" width="92" height="27.5" rx="4" fill="url(#floor)"/>
<text x="1090.0" y="717.3" text-anchor="middle" class="big">0.59 J</text>
<rect x="1044.0" y="681.6" width="92" height="16.9" rx="4" fill="#fb7185" opacity="0.92"/>
<text x="1090.0" y="672.6" text-anchor="middle" class="rose">+0.36 J</text>
<text x="1090.0" y="748.0" text-anchor="middle" class="tick">8 agents</text>
<rect x="735" y="558" width="16" height="16" rx="3" fill="url(#floor)"/>
<text x="759" y="571" class="lab">shared weight stream + static floor (130W, fixed)</text>
<rect x="735" y="584" width="16" height="16" rx="3" fill="#fb7185"/>
<text x="759" y="597" class="lab">compute (10W per agent, scales with batch)</text>
<text x="86" y="778.0" class="note">The floor is paid once per decode step and shared, so its per-token energy falls the full 5.6&#215; (3.28 J &#8594; 0.59 J).</text>
<text x="86" y="798.0" class="note">The compute term is paid per agent, so per token it rises (0.25 J &#8594; 0.36 J). Their sum falls only 3.7&#215;.</text>
</svg>