<rect x="214" y="210" width="152" height="20" rx="3" fill="#6dc79a" fill-opacity="0.9"/>
<rect x="214" y="240" width="70"  height="20" rx="3" fill="#d98cc0" fill-opacity="0.9"/>
<rect x="214" y="270" width="112" height="20" rx="3" fill="#57b8cf" fill-opacity="0.9"/>
<rect x="214" y="300" width="160" height="20" rx="3" fill="#7f9cf0" fill-opacity="0.9"/>
<rect x="214" y="330" width="98"  height="20" rx="3" fill="#6dc79a" fill-opacity="0.9"/>
