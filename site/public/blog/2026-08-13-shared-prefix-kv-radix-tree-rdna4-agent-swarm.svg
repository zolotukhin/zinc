<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Eight agents on one RX 9070 XT share an identical system-prompt and tool-schema prefix; caching it once instead of eight times reclaims about 2.1 GiB of VRAM</title>
<desc id="d">A two-panel comparison on a deep plum background. The left panel, labelled naive, shows eight decode rows, one per agent, each starting with an identical amber block that represents the same 2,000-token system prompt and tool schemas, followed by a differently sized cool-coloured block for that agent's unique working context. A coral outline groups the eight amber blocks and is annotated: same 2,000 tokens, copied 8 times, equals 2.44 GiB of duplicated KV cache. The right panel, labelled shared prefix, shows a single tall amber node holding the same 2,000-token prefix, stored once at 0.30 GiB, with eight curved branches fanning out to the eight agents' unique cool-coloured tails, like a radix tree. It is annotated: one copy, 0.30 GiB, reclaims 2.14 GiB. A footer notes the model and arithmetic: Qwen3.5-9B, 40 layers, 8 grouped-query-attention KV heads, head dim 128, fp16 KV is about 160 KiB per token, so 2,000 shared tokens cost 0.30 GiB per copy; the reclaimed 2.14 GiB is roughly the entire preemption headroom the swarm otherwise has on a 16 GB card.</desc>
<rect x="0" y="0" width="1080" height="620" rx="14" fill="#1c1526"/>
<text x="34" y="40" fill="#f1ebf7" font-size="20" font-weight="700">Eight agents, one system prompt: cache the shared prefix once, not eight times</text>
<text x="34" y="64" fill="#ab9dc0" font-size="12.5">One RX 9070 XT, Qwen3.5-9B, eight decode slots. Every agent carries the same system prompt and tool schemas as a static prefix.</text>
<text x="34" y="81" fill="#ab9dc0" font-size="12.5">At ~160 KiB per token, a 2,000-token shared prefix is 0.30 GiB. Stored per agent it is copied eight times; stored once it is not.</text>

<line x1="540" y1="104" x2="540" y2="536" stroke="#34293f" stroke-width="1.2"/>

<!-- LEFT: naive -->
<text x="34" y="124" fill="#e0704f" font-size="13.5" font-weight="700">Naive &#8212; each agent caches its own copy of the prefix</text>

<!-- rows -->
