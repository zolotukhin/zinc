<!-- duplication outline over amber column -->
<rect x="123" y="145" width="96" height="240" rx="5" fill="none" stroke="#e0704f" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="171" y="404" fill="#f0a58c" font-size="10.5" font-weight="600" text-anchor="middle">same 2,000 tokens, copied 8&#215;</text>
<text x="171" y="420" fill="#f0a58c" font-size="11.5" font-weight="700" text-anchor="middle">= 2.44 GiB duplicated KV</text>
<text x="300" y="446" fill="#8a7ea0" font-size="10" text-anchor="middle">amber = shared prefix &#183; colour = each agent's unique working context</text>

<!-- RIGHT: shared -->
<text x="560" y="124" fill="#6dc79a" font-size="13.5" font-weight="700">Shared prefix &#8212; one radix node, referenced by all eight</text>

<!-- trunk node -->
<rect x="576" y="200" width="118" height="150" rx="6" fill="#e3a13d" fill-opacity="0.95"/>
<g fill="#2e2007" text-anchor="middle">
<text x="635" y="232" font-size="11.5" font-weight="700">system prompt</text>
<text x="635" y="250" font-size="11.5" font-weight="700">+ tool schemas</text>
<text x="635" y="276" font-size="11">2,000 tokens</text>
<text x="635" y="300" font-size="11" font-weight="700">stored once</text>
<text x="635" y="326" font-size="14" font-weight="700">0.30 GiB</text>
</g>

<!-- branches -->
<g fill="none" stroke="#e3a13d" stroke-opacity="0.55" stroke-width="1.6">
<path d="M694,275 C748,275 742,159 800,159"/>
