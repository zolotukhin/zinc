<!-- agent tails on the tree -->
<rect x="800" y="150" width="150" height="18" rx="3" fill="#57b8cf" fill-opacity="0.9"/>
<rect x="800" y="178" width="110" height="18" rx="3" fill="#7f9cf0" fill-opacity="0.9"/>
<rect x="800" y="206" width="172" height="18" rx="3" fill="#6dc79a" fill-opacity="0.9"/>
<rect x="800" y="234" width="90"  height="18" rx="3" fill="#d98cc0" fill-opacity="0.9"/>
<rect x="800" y="262" width="132" height="18" rx="3" fill="#57b8cf" fill-opacity="0.9"/>
<rect x="800" y="290" width="180" height="18" rx="3" fill="#7f9cf0" fill-opacity="0.9"/>
<rect x="800" y="318" width="118" height="18" rx="3" fill="#6dc79a" fill-opacity="0.9"/>
<rect x="800" y="346" width="144" height="18" rx="3" fill="#d98cc0" fill-opacity="0.9"/>
<text x="806" y="141" fill="#8a7ea0" font-size="10">eight agents' unique tails, still one copy each</text>

<text x="635" y="392" fill="#8fd6ac" font-size="11.5" font-weight="700" text-anchor="middle">one copy = 0.30 GiB</text>
<text x="700" y="420" fill="#8fd6ac" font-size="15" font-weight="700" text-anchor="middle">reclaims 2.14 GiB of VRAM</text>

<!-- footer -->
<line x1="34" y1="470" x2="1046" y2="470" stroke="#34293f" stroke-width="1"/>
<text x="540" y="494" fill="#9a8fb0" font-size="10.5" text-anchor="middle">KV per token = 2 (K,V) &#215; 8 GQA heads &#215; 128 dim &#215; 40 layers = 81,920 elements, 160 KiB in fp16. A 2,000-token prefix is 0.30 GiB per copy.</text>
<text x="540" y="512" fill="#9a8fb0" font-size="10.5" text-anchor="middle">Eight copies cost 2.44 GiB; one shared copy costs 0.30 GiB, so sharing reclaims 2.14 GiB &#8212; about the whole preemption headroom on a 16 GB card.</text>
<text x="540" y="530" fill="#726585" font-size="10" text-anchor="middle">Prefix sharing is a capacity and prefill win; cutting the per-agent decode read of the shared keys needs a shared-prefix attention kernel. Proportions are illustrative.</text>
</svg>
