<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1080" height="620" rx="14" fill="#141a2e"/>
<defs><linearGradient id="gapA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef7361" stop-opacity="0.42"/><stop offset="1" stop-color="#ef7361" stop-opacity="0.10"/></linearGradient></defs>
<text x="34" y="44" fill="#eaf0ff" font-size="22" font-weight="700">Who gets the eight decode slots when twelve agents want them</text>
<text x="34" y="68" fill="#8aa0c0" font-size="12.5">Twelve agents contend for eight concurrent decode slots on one RX 9070 XT (Qwen3.5-9B, batched step t(8)=16.9+1.1x8=25.7 ms, ~39 tok/s per slot).</text>
<text x="34" y="85" fill="#8aa0c0" font-size="12.5">Cumulative tokens each agent has been served over a 30-second window. The shaded band is the gap between the best- and worst-served agent.</text>
<text x="95" y="120" fill="#eaf0ff" font-size="14" font-weight="600">First come, hold until done</text>
<text x="95" y="137" fill="#8aa0c0" font-size="11">the eight earliest agents keep their slots; four never get in</text>
<text x="610" y="120" fill="#eaf0ff" font-size="14" font-weight="600">Fair queuing (VTC)</text>
<text x="610" y="137" fill="#8aa0c0" font-size="11">slots rotate by fewest tokens served; the gap stays bounded</text>
<line x1="95" y1="150" x2="95" y2="440" stroke="#33406a" stroke-width="1.2"/>
<line x1="95" y1="440" x2="470" y2="440" stroke="#33406a" stroke-width="1.2"/>
<line x1="95" y1="440.0" x2="470" y2="440.0" stroke="#222a49" stroke-width="1"/>
