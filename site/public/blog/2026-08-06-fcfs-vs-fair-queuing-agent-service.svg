<text x="87" y="371.0" fill="#66789e" font-size="10" text-anchor="end">300</text>
<line x1="95" y1="295.0" x2="470" y2="295.0" stroke="#222a49" stroke-width="1"/>
<text x="87" y="298.5" fill="#66789e" font-size="10" text-anchor="end">600</text>
<line x1="95" y1="222.5" x2="470" y2="222.5" stroke="#222a49" stroke-width="1"/>
<text x="87" y="226.0" fill="#66789e" font-size="10" text-anchor="end">900</text>
<line x1="95" y1="150.0" x2="470" y2="150.0" stroke="#222a49" stroke-width="1"/>
<text x="87" y="153.5" fill="#66789e" font-size="10" text-anchor="end">1200</text>
