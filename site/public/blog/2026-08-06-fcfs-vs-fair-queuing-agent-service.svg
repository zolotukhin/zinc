<polygon points="95.0,440.0 470.0,157.2 470.0,429.1 95.0,440.0" fill="url(#gapA)"/>
<line x1="95.0" y1="440.0" x2="470.0" y2="157.2" stroke="#e8b84b" stroke-width="3"/>
<polyline points="95.0,440.0 120.0,432.8 470.0,429.1" fill="none" stroke="#4fd0a6" stroke-width="3"/>
