<line x1="610" y1="367.5" x2="985" y2="367.5" stroke="#222a49" stroke-width="1"/>
<text x="602" y="371.0" fill="#66789e" font-size="10" text-anchor="end">300</text>
<line x1="610" y1="295.0" x2="985" y2="295.0" stroke="#222a49" stroke-width="1"/>
<text x="602" y="298.5" fill="#66789e" font-size="10" text-anchor="end">600</text>
<line x1="610" y1="222.5" x2="985" y2="222.5" stroke="#222a49" stroke-width="1"/>
<text x="602" y="226.0" fill="#66789e" font-size="10" text-anchor="end">900</text>
<line x1="610" y1="150.0" x2="985" y2="150.0" stroke="#222a49" stroke-width="1"/>
<text x="602" y="153.5" fill="#66789e" font-size="10" text-anchor="end">1200</text>
<text x="610.0" y="456" fill="#66789e" font-size="10" text-anchor="middle">0s</text>
<text x="735.0" y="456" fill="#66789e" font-size="10" text-anchor="middle">10s</text>
