<text x="464.0" y="421.1" fill="#4fd0a6" font-size="11" text-anchor="end" font-weight="600">starved agent ~45</text>
<text x="282.5" y="304.7" fill="#f3b0a5" font-size="11" text-anchor="middle" font-weight="600">service gap 1,125 tokens</text>
<text x="282.5" y="319.7" fill="#c98a80" font-size="9.5" text-anchor="middle">and still widening</text>
<polygon points="610.0,440.0 985.0,251.5 985.0,266.0 610.0,440.0" fill="url(#gapA)"/>
<line x1="610.0" y1="440.0" x2="985.0" y2="251.5" stroke="#e8b84b" stroke-width="3"/>
<line x1="610.0" y1="440.0" x2="985.0" y2="266.0" stroke="#4fd0a6" stroke-width="3"/>
<circle cx="985.0" cy="251.5" r="4" fill="#e8b84b"/>
<text x="979.0" y="243.5" fill="#e8b84b" font-size="11" text-anchor="end" font-weight="600">busiest agent 780</text>
<circle cx="985.0" cy="266.0" r="4" fill="#4fd0a6"/>
<text x="979.0" y="282.0" fill="#4fd0a6" font-size="11" text-anchor="end" font-weight="600">worst-served 720</text>
<text x="722.5" y="198.3" fill="#f3b0a5" font-size="11" text-anchor="middle" font-weight="600">gap 60 tokens, bounded</text>
<text x="722.5" y="213.3" fill="#c98a80" font-size="9.5" text-anchor="middle">VTC proves a 2x cap on service difference</text>
<line x1="34" y1="500" x2="1046" y2="500" stroke="#2a3358" stroke-width="1"/>
<rect x="34" y="516" width="12" height="12" rx="2" fill="#e8b84b"/><text x="52" y="526" fill="#8aa0c0" font-size="10.5">best-served agent</text>
<rect x="210" y="516" width="12" height="12" rx="2" fill="#4fd0a6"/><text x="228" y="526" fill="#8aa0c0" font-size="10.5">worst-served agent</text>
<rect x="400" y="516" width="12" height="12" rx="2" fill="url(#gapA)"/><text x="418" y="526" fill="#8aa0c0" font-size="10.5">service gap (unfairness)</text>
<text x="540" y="550" fill="#66789e" font-size="10" text-anchor="middle">Both policies keep all 8 slots full every step, so aggregate throughput is the same 311 tok/s; only the distribution differs.</text>
</svg>