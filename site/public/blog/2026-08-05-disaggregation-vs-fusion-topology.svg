<svg viewBox="0 0 1000 648" width="1000" height="648" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif">
<defs>
<linearGradient id="bp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2138"/><stop offset="1" stop-color="#081627"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#12324e" stroke-width="1"/></pattern>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#54c7e0"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="648" fill="url(#bp)"/>
<rect x="0" y="0" width="1000" height="648" fill="url(#grid)"/>
<text x="40" y="46" fill="#eaf4fb" font-size="21" font-weight="700">Two answers to prefill/decode interference, set by your GPU count</text>
<text x="40" y="72" fill="#7fa8c4" font-size="15">The datacenter buys isolation in space with a second GPU. A single RDNA4 desktop buys the same isolation in time.</text>
<line x1="500" y1="96" x2="500" y2="512" stroke="#1c4666" stroke-width="1.5" stroke-dasharray="5 6"/>

<!-- LEFT: disaggregation -->
<text x="40" y="122" fill="#8fd6e8" font-size="16.5" font-weight="700">Datacenter &#8212; disaggregate across GPUs</text>
<text x="40" y="144" fill="#6f97b2" font-size="12">Separate silicon per phase. Isolation costs a whole second GPU.</text>

<!-- request stack -->
<g>
<rect x="46" y="188" width="70" height="9" rx="1.5" fill="#3a6f8c"/>
<rect x="46" y="202" width="70" height="9" rx="1.5" fill="#3a6f8c"/>
<rect x="46" y="216" width="70" height="9" rx="1.5" fill="#3a6f8c"/>
<rect x="46" y="230" width="70" height="9" rx="1.5" fill="#3a6f8c"/>
<text x="46" y="180" fill="#6f97b2" font-size="11.5">thousands of requests</text>
<line x1="118" y1="213" x2="156" y2="213" stroke="#54c7e0" stroke-width="1.6" marker-end="url(#ar)"/>
</g>

<!-- prefill box -->
<rect x="160" y="176" width="210" height="74" rx="6" fill="#0f2c46" stroke="#f0a24b" stroke-width="1.8"/>
<text x="265" y="203" text-anchor="middle" fill="#f4c78a" font-size="14.5" font-weight="700">Prefill GPU pool</text>
<text x="265" y="223" text-anchor="middle" fill="#cfe3f0" font-size="12">compute-bound, runs flat out</text>
<text x="265" y="240" text-anchor="middle" fill="#89a7bd" font-size="11">holds its own copy of the weights</text>

<!-- transfer arrow -->
<line x1="265" y1="250" x2="265" y2="336" stroke="#54c7e0" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="286" y="272" width="196" height="42" rx="5" fill="#0c2942" stroke="#2a6f86" stroke-width="1"/>
<text x="384" y="290" text-anchor="middle" fill="#8fd6e8" font-size="12.5" font-weight="600">KV cache transfer</text>
<text x="384" y="307" text-anchor="middle" fill="#7fb6cc" font-size="11.5">over NVLink, &#8776; 900 GB/s fabric</text>

<!-- decode box -->
<rect x="160" y="340" width="210" height="74" rx="6" fill="#0f2c46" stroke="#4ec97a" stroke-width="1.8"/>
<text x="265" y="367" text-anchor="middle" fill="#a7e6bf" font-size="14.5" font-weight="700">Decode GPU pool</text>
<text x="265" y="387" text-anchor="middle" fill="#cfe3f0" font-size="12">memory-bound, streams weights</text>
<text x="265" y="404" text-anchor="middle" fill="#89a7bd" font-size="11">also holds a full copy of the weights</text>

<text x="40" y="452" fill="#9ab6c9" font-size="12.5">&#8805; 2 GPUs &#183; phases right-sized independently</text>
<text x="40" y="472" fill="#9ab6c9" font-size="12.5">7.4&#215; more requests within SLO (DistServe, OSDI 2024)</text>
<text x="40" y="492" fill="#9ab6c9" font-size="12.5">a dedicated prefill pool only pays off when request volume keeps it busy</text>

<!-- RIGHT: fusion -->
<text x="520" y="122" fill="#f0a24b" font-size="16.5" font-weight="700">Single card &#8212; fuse in time</text>
<text x="520" y="144" fill="#6f97b2" font-size="12">One GPU interleaves prefill chunks with decodes in time.</text>

<rect x="560" y="176" width="380" height="150" rx="8" fill="#0f2c46" stroke="#54c7e0" stroke-width="1.8"/>
<text x="750" y="203" text-anchor="middle" fill="#eaf4fb" font-size="14.5" font-weight="700">RX 9070 XT &#183; 16 GB &#183; one weight copy</text>

<!-- interleaved lane -->
<text x="584" y="232" fill="#89a7bd" font-size="11.5">one iteration stream, left to right</text>
<g>
<!-- amber prefill chunks + green decode ticks alternating -->
<rect x="584" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="614" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="623" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="653" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="662" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="692" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="701" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="731" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="740" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="770" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="779" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="809" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="818" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="848" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="857" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
<rect x="887" y="242" width="5" height="30" rx="1" fill="#4ec97a"/>
<rect x="896" y="242" width="26" height="30" rx="2" fill="#f0a24b" fill-opacity="0.9"/>
</g>
<g font-size="11.5">
<rect x="584" y="286" width="13" height="13" rx="2" fill="#f0a24b"/><text x="603" y="296" fill="#9ab6c9">prefill chunk</text>
<rect x="700" y="286" width="6" height="13" rx="1" fill="#4ec97a"/><text x="712" y="296" fill="#9ab6c9">8 decodes ride every iteration</text>
</g>
<text x="750" y="318" text-anchor="middle" fill="#7fb6cc" font-size="12">KV stays in place &#183; no transfer, no second weight copy</text>

<text x="520" y="452" fill="#9ab6c9" font-size="12.5">1 GPU &#183; isolation in the time domain</text>
<text x="520" y="472" fill="#9ab6c9" font-size="12.5">worst-case decode stall 8.3 s &#8594; 0.66 s with 128-token chunks</text>
<text x="520" y="492" fill="#9ab6c9" font-size="12.5">the incoming agent pays only about 3% more time-to-first-token</text>

<!-- BOTTOM: interconnect bars -->
<line x1="40" y1="524" x2="960" y2="524" stroke="#1c4666" stroke-width="1"/>
<text x="40" y="550" fill="#cfe3f0" font-size="14" font-weight="700">The transfer disaggregation depends on rides a fabric a desktop does not have</text>
<g font-size="12">
<text x="40" y="578" fill="#9ab6c9">NVLink 4 (H100)</text>
<rect x="196" y="568" width="620" height="14" rx="3" fill="#54c7e0"/>
<text x="824" y="579" fill="#8fd6e8">&#8776; 900 GB/s</text>
<text x="40" y="602" fill="#9ab6c9">PCIe 5.0 x16 (RX 9070 XT)</text>
<rect x="196" y="592" width="44" height="14" rx="3" fill="#f0a24b"/>
<text x="248" y="603" fill="#f4c78a">&#8776; 64 GB/s per direction</text>
</g>
<text x="40" y="632" fill="#7fa8c4" font-size="12">One 1,730-token prompt&#8217;s KV is &#8776; 250 MB: 0.28 ms on NVLink, &#8776; 4 ms on PCIe. Cheap at 9B; the second card&#8217;s duplicated weights are not.</text>
</svg>
