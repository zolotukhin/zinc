<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="obsFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2673a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d2673a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="600" rx="14" fill="#211a17"/>

  <!-- Title -->
  <text x="34" y="40" fill="#f0e6d6" font-size="21" font-weight="700">A local coding agent reads back far more than it writes</text>
  <text x="34" y="63" fill="#b9a88f" font-size="13.5">Qwen3.5-9B on one RX 9070 XT — 962 tok/s prefill, 39.6 tok/s decode (measured); tool sizes representative</text>

  <line x1="500" y1="92" x2="500" y2="560" stroke="#3a2f2a" stroke-width="1"/>

  <!-- ================= LEFT PANEL ================= -->
  <text x="34" y="112" fill="#e8dcc8" font-size="14.5" font-weight="600">One ReAct step: tokens written vs tokens fed back</text>

  <!-- token axis reference at 2000 -->
  <line x1="260" y1="126" x2="260" y2="356" stroke="#d8c26a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="150" y="392" fill="#d8c26a" font-size="11.5">typical observation ≈ 2,000</text>

  <!-- row 1: model writes -->
  <text x="70" y="140" fill="#e8dcc8" font-size="12">thought + tool call — the model writes</text>
  <rect x="70" y="146" width="10.5" height="22" rx="2" fill="#e8a24d"/>
  <text x="88" y="162" fill="#e8a24d" font-size="12" font-weight="600">110</text>

  <!-- row 2 -->
  <text x="70" y="190" fill="#e8dcc8" font-size="12">cat a 300-line source file</text>
  <rect x="70" y="196" width="342" height="22" rx="2" fill="url(#obsFill)"/>
  <text x="418" y="212" fill="#e7c3a6" font-size="12" font-weight="600">3,600</text>

  <!-- row 3 -->
  <text x="70" y="240" fill="#e8dcc8" font-size="12">grep -rn across the repo</text>
  <rect x="70" y="246" width="85.5" height="22" rx="2" fill="url(#obsFill)"/>
  <text x="162" y="262" fill="#e7c3a6" font-size="12" font-weight="600">900</text>

  <!-- row 4 -->
  <text x="70" y="290" fill="#e8dcc8" font-size="12">pytest run + traceback</text>
  <rect x="70" y="296" width="142.5" height="22" rx="2" fill="url(#obsFill)"/>
  <text x="219" y="312" fill="#e7c3a6" font-size="12" font-weight="600">1,500</text>

  <!-- row 5 -->
  <text x="70" y="340" fill="#e8dcc8" font-size="12">web fetch / API result</text>
  <rect x="70" y="346" width="380" height="22" rx="2" fill="url(#obsFill)"/>
  <text x="456" y="362" fill="#e7c3a6" font-size="12" font-weight="600">4,000</text>

  <!-- legend + punchline -->
  <rect x="70" y="404" width="360" height="46" rx="8" fill="#2c221d" stroke="#4a3a30" stroke-width="1"/>
  <text x="86" y="426" fill="#f0e6d6" font-size="13.5" font-weight="700">≈ 18 tokens read back for every 1 written</text>
  <text x="86" y="443" fill="#b9a88f" font-size="11.5">the observation enters as prefill; the call was decode</text>

  <rect x="70" y="470" width="13" height="13" rx="2" fill="#e8a24d"/>
  <text x="90" y="481" fill="#c9b79c" font-size="11.5">model writes (decode)</text>
  <rect x="240" y="470" width="13" height="13" rx="2" fill="#d2673a"/>
  <text x="260" y="481" fill="#c9b79c" font-size="11.5">tool observation (prefill)</text>

  <!-- ================= RIGHT PANEL ================= -->
  <text x="524" y="112" fill="#e8dcc8" font-size="14.5" font-weight="600">Cumulative context over a 30-step task</text>

  <!-- axes -->
  <line x1="560" y1="150" x2="560" y2="540" stroke="#4a3a30" stroke-width="1.2"/>
  <line x1="560" y1="540" x2="940" y2="540" stroke="#4a3a30" stroke-width="1.2"/>

  <!-- y gridlines -->
  <line x1="560" y1="428.6" x2="940" y2="428.6" stroke="#33291f" stroke-width="1"/>
  <text x="554" y="432" fill="#8a7a68" font-size="10" text-anchor="end">20k</text>
  <line x1="560" y1="317.1" x2="940" y2="317.1" stroke="#33291f" stroke-width="1"/>
  <text x="554" y="321" fill="#8a7a68" font-size="10" text-anchor="end">40k</text>
  <line x1="560" y1="205.7" x2="940" y2="205.7" stroke="#33291f" stroke-width="1"/>
  <text x="554" y="209" fill="#8a7a68" font-size="10" text-anchor="end">60k</text>

  <!-- x ticks -->
  <text x="560" y="555" fill="#8a7a68" font-size="10" text-anchor="middle">0</text>
  <text x="686.7" y="555" fill="#8a7a68" font-size="10" text-anchor="middle">10</text>
  <text x="813.3" y="555" fill="#8a7a68" font-size="10" text-anchor="middle">20</text>
  <text x="940" y="555" fill="#8a7a68" font-size="10" text-anchor="middle">30</text>
  <text x="750" y="573" fill="#b9a88f" font-size="11" text-anchor="middle">agent step</text>

  <!-- observation area (top, dominant) -->
  <polygon points="560,517.7 940,499.3 940,165 560,517.7" fill="url(#obsFill)"/>
  <!-- model output band (thin) -->
  <polygon points="560,517.7 940,517.7 940,499.3 560,517.7" fill="#e8a24d" fill-opacity="0.95"/>
  <!-- system prompt base -->
  <polygon points="560,540 940,540 940,517.7 560,517.7" fill="#5f7078" fill-opacity="0.9"/>

  <!-- budget line -->
  <line x1="560" y1="233.6" x2="940" y2="233.6" stroke="#d8c26a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="676" y="228" fill="#d8c26a" font-size="11">single-card KV budget ≈ 55,000 (16 GB)</text>

  <!-- crossing marker -->
  <circle cx="866" cy="233.6" r="4.5" fill="#f0e6d6" stroke="#d2673a" stroke-width="1.5"/>
  <text x="858" y="252" fill="#f0e6d6" font-size="10.5" text-anchor="end">crosses ≈ step 24</text>

  <!-- area labels -->
  <text x="782" y="432" fill="#fbeadd" font-size="12.5" font-weight="700">tool observations ≈ 95%</text>
  <text x="676" y="497" fill="#f0c48a" font-size="10.5">model output ≈ 5%</text>
  <text x="566" y="533" fill="#eef3f4" font-size="10">system prompt + schemas 4,000</text>

  <text x="560" y="588" fill="#b9a88f" font-size="11">Observations, not the model's own output, are what overflow the budget.</text>
</svg>
