<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The interactive response-time law caps a local RDNA4 agent swarm near twelve agents, not at the eight decode slots</title>
<desc id="d">A dual-axis line chart on a dark espresso-brown background. The horizontal axis is the number of live agents in a coding session on one RX 9070 XT running Qwen3.5-9B, from 0 to 24. The left axis, in gold, is aggregate throughput in tokens per second from 0 to 350; the right axis, in terracotta, is mean response time per agent turn in seconds from 0 to 24. A gold throughput line rises linearly at about 27 tokens per second per added agent and then flattens hard at the card ceiling of 311 tokens per second. A terracotta response-time line stays flat at the minimum decode time of about 9.1 seconds while slots are free, then bends upward and climbs linearly to about 23 seconds at 24 agents. Both lines bend at the same point, a green dashed vertical marker at about 11.5 agents labelled the knee, equal to 8 slots times one plus the ratio of think time to decode time. To the left of the knee, adding an agent buys real throughput; to the right, a shaded region, throughput is pinned at 311 tokens per second and every added agent only adds waiting. A footnote gives the model: 8 decode slots, 311 tokens per second aggregate, a mean turn of 354 tokens taking about 9.1 seconds to decode, and about 4 seconds of think time between turns while the agent runs a tool or reads files.</desc>
<rect x="0" y="0" width="1080" height="600" rx="14" fill="#211812"/>
<defs><linearGradient id="past" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e56a4e" stop-opacity="0.14"/><stop offset="1" stop-color="#e56a4e" stop-opacity="0.03"/></linearGradient></defs>
<text x="34" y="42" fill="#f3e9de" font-size="22" font-weight="700">Eight decode slots keep about twelve agents responsive, not eight</text>
<text x="34" y="66" fill="#b89a82" font-size="12.5">One RX 9070 XT, Qwen3.5-9B: 8 decode slots, 311 tok/s aggregate. A mean agent turn is ~354 tokens, ~9.1 s to decode,</text>
<text x="34" y="83" fill="#b89a82" font-size="12.5">with ~4 s of think time between turns while the agent runs a tool or reads files. The knee sits at 8 &#215; (1 + Z/S) &#8776; 12 agents.</text>
