<text x="314.0" y="295.9" fill="#f0b24a" font-size="11.5" font-weight="600">throughput: +27 tok/s per agent&#8230;</text>
<text x="758.0" y="147.0" fill="#f0b24a" font-size="11.5" font-weight="600" text-anchor="middle">&#8230;then pinned at 311 tok/s</text>
<text x="240.0" y="325.2" fill="#e56a4e" font-size="11.5" font-weight="600">response flat at ~9.1 s (no wait)</text>
<text x="869.0" y="169.7" fill="#e56a4e" font-size="11.5" font-weight="600" text-anchor="middle">then +1.1 s of wait per agent</text>
<text x="536" y="504" fill="#9c8065" font-size="11" text-anchor="middle">live agents in the session (each loops: decode a turn, then run a tool or read files, then decode again)</text>
<text x="30" y="295" fill="#f0b24a" font-size="11" text-anchor="middle" transform="rotate(-90 30 295)">aggregate throughput (tok/s)</text>
<text x="1058" y="295" fill="#e56a4e" font-size="11" text-anchor="middle" transform="rotate(90 1058 295)">mean response time per turn (s)</text>
<line x1="34" y1="536" x2="1046" y2="536" stroke="#3a2c22" stroke-width="1"/>
<text x="540" y="560" fill="#9c8065" font-size="10.5" text-anchor="middle">Interactive response-time law (Little's Law): with N agents, response time R = N / throughput &#8722; think time. Below the knee the card has idle slots; above it, throughput is fixed and each new agent only lengthens the queue.</text>
<text x="540" y="577" fill="#7a6250" font-size="9.5" text-anchor="middle">Modeled on one RX 9070 XT; the exact knee moves with think time Z, but the shape does not.</text>
</svg>