<text x="34" y="514" fill="#6b7280" font-size="10.5">Modeled for Qwen3.5-9B Q4_K_M on one RX 9070 XT (16 GB, ~640 GB/s). Decode step t(B,C) = 16.9 + B&#183;(1.1 + k&#183;C) ms; batch-8 shown.</text>
<text x="34" y="530" fill="#6b7280" font-size="10.5">FP16 KV: 0.14 MB/token/agent; Q8 halves it. Crossover is where batched KV traffic equals the once-per-step 5.5 GB weight read. Memory-bound decode.</text>
