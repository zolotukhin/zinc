<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="600" rx="14" fill="#16181d"/>
<text x="34" y="42" fill="#e9edf4" font-size="21" font-weight="700">Quantizing the KV cache pushes the swarm&#8217;s crossover from 5k to 10k tokens</text>
<text x="34" y="66" fill="#9aa3b2" font-size="12.5">Qwen3.5-9B on one 16 GB RX 9070 XT: eight agents split one 5.5 GB weight stream per decode step, but each reads its own KV cache.</text>
<text x="34" y="84" fill="#9aa3b2" font-size="12.5">FP16 KV traffic overtakes the shared weights at about 5k tokens per agent; a Q8 KV cache halves the slope and moves that crossover to 10k.</text>
