<style>.title{fill:#eef7f6;font-size:27px;font-weight:780}.subtitle{fill:#8fb0b2;font-size:14px}.axl{fill:#c9dedd;font-size:13.5px;font-weight:700}.ax{fill:#7fa0a3;font-size:12.5px}.leg{fill:#c9dedd;font-size:13px}.amb{fill:#f5a524;font-size:12.5px;font-weight:740}.ambb{fill:#f5a524;font-size:13px;font-weight:740}.cyn{fill:#3ec9d6;font-size:12.5px;font-weight:740}.mk{fill:#eef7f6;font-size:12.5px;font-weight:700}.mks{fill:#8fb0b2;font-size:11.5px}.note{fill:#dbeceb;font-size:13px;font-weight:620}</style></defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<text x="56" y="52" class="title">Every prefill chunk size on an RX 9070 XT gives something up</text>
<text x="56" y="78" class="subtitle">Admitting one 8,000-token prompt into a batch of 8 sequences already decoding. Qwen3.5-9B Q4_K_M, one RX 9070 XT, 962 tok/s prefill, 25.7 ms decode step.</text>
<text x="56" y="99" class="subtitle">Small chunks keep the running agents producing tokens. Large chunks admit the newcomer sooner. No chunk size does both.</text>
