<rect x="90" y="646" width="1020" height="56" rx="8" fill="#132f34" stroke="#22484f"/>
<text x="112" y="670" class="note">At both vendor defaults a running sequence emits under two tokens per second for the whole admission window.</text>
<text x="112" y="690" class="note">Holding all eight agents above 10 tok/s costs 2.9 extra seconds before the ninth agent sees its first token.</text>
<text x="56" y="778" class="ax">Model: step = 25.7 ms decode + 1.04 ms per prefill token. Assumes a chunk sustains the full 962 tok/s prefill rate, which small chunks will not. Modeled, not measured.</text>
