<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial">
  <title id="title">Why the key cache is quantized per-channel and the value cache per-token</title>
  <desc id="desc">Two matrices with tokens as rows and channels as columns. The key cache on the left has a few amber outlier channels that must be grouped per-channel; a per-token grouping fails because the outlier sets the range. The value cache on the right is uniform, so per-token grouping is fine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="url(#bg)"/>

  <text x="40" y="46" fill="#e8edf5" font-size="21" font-weight="700">The KV cache is two distributions, not one</text>
  <text x="40" y="70" fill="#8ea0b8" font-size="13">Rows are tokens, columns are channels. Amber columns are the large-magnitude outlier channels.</text>

