  <text x="40" y="530" fill="#8ea0b8" font-size="11.5">Keys carry per-channel outliers, so they group along channels; values are uniform, so per-token grouping works.</text>
  <text x="40" y="546" fill="#8ea0b8" font-size="11.5">This asymmetry, measured by KIVI, is why a single uniform low-bit knob falls off a quality cliff.</text>
