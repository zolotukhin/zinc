  <text x="70" y="136" fill="#9aacbf" font-size="12">a few channels carry huge magnitudes</text>
  <text x="190.0" y="170" fill="#6b7d97" font-size="11" text-anchor="middle">channels &#8594;</text>
  <text x="52" y="268.0" fill="#6b7d97" font-size="11" text-anchor="middle" transform="rotate(-90 52 268.0)">tokens &#8595;</text>
