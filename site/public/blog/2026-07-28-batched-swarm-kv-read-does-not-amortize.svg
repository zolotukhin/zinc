<rect x="0" y="0" width="1000" height="600" rx="14" fill="#161231"/>
<text x="34" y="42" fill="#ece9ff" font-size="21" font-weight="700">Batching shares the weights, not the KV cache</text>
<text x="34" y="66" fill="#a49ad6" font-size="12.5">Qwen3.5-9B on one RX 9070 XT: eight agents share one 5.5 GB weight stream per decode step, but each still reads its own KV cache.</text>
<text x="34" y="84" fill="#a49ad6" font-size="12.5">As context grows, the private KV read swamps the shared weights, and the swarm’s 8x ceiling erodes toward 1x.</text>
