<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Same mean turn and same load: turn-length variance sets the tail, and preemption relocates it onto the long turns</title>
<desc id="dsc">A survival-curve (complementary CDF) chart on a dark plum background. The horizontal axis is per-turn response time in seconds from 0 to 80. The vertical axis is the probability that a turn takes longer than that time, on a logarithmic scale from 100 percent down to 0.1 percent. Three curves from a discrete-event simulation of eight decode slots at 39 tokens per second per slot, 80 percent utilization, mean turn 354 tokens. The cyan curve is a low-variance workload (coefficient of variation 0.15) served without preemption; it drops steeply, with a median of 9.8 seconds and a 99th percentile of 20 seconds. The gold curve is a high-variance workload (coefficient of variation 1.13) with the same mean, served without preemption; it starts lower, giving a faster median of 6.4 seconds, but its tail is much fatter, with a 99th percentile of 47 seconds. The coral curve is the same high-variance workload served with preemptive least-attained-service scheduling; it has the fastest median of 3.6 seconds but the fattest tail of all, still above the 1 percent line at 80 seconds, with a 99th percentile near 100 seconds. Dashed horizontal guides mark the median at 50 percent and the 99th percentile at 1 percent. The curves cross: favoring short turns lowers the median and raises the tail.</desc>
<rect x="0" y="0" width="1120" height="600" rx="14" fill="#1b1426"/>
<text x="34" y="42" fill="#f3ecff" font-size="22" font-weight="700">Turn-length variance sets the tail; preemption just moves it onto the long turns</text>
<text x="34" y="66" fill="#b3a2c9" font-size="12.5">Simulated response time for one RX 9070 XT: 8 decode slots, ~39 tok/s per slot, 80% utilization, mean turn 354 tokens. Survival curve: share of turns slower than x.</text>
