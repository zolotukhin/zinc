<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="640" rx="14" fill="#0e2129"/>
<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#3a5560"/><line x1="0" y1="0" x2="0" y2="7" stroke="#25404a" stroke-width="3"/></pattern></defs>
<text x="34" y="44" fill="#e2eef2" font-size="22" font-weight="700">A static batch keeps paying the weight stream for finished agents</text>
<text x="34" y="68" fill="#7fa2ad" font-size="12.5">Eight agents on one RX 9070 XT start together, then finish at different token counts. A naive static batch holds width 8 until the last one ends,</text>
<text x="34" y="85" fill="#7fa2ad" font-size="12.5">so every finished lane is compute spent on padding. Modeled from the measured decode step t(B)=16.9+1.1B ms for Qwen3.5-9B Q4_K_M.</text>
<text x="34" y="110" fill="#e2eef2" font-size="13" font-weight="600">One static batch, eight lanes (bar length = tokens generated)</text>
<line x1="215.0" y1="114" x2="215.0" y2="296" stroke="#23414c" stroke-width="1"/>
<text x="215.0" y="312" fill="#7fa2ad" font-size="10.5" text-anchor="middle">0 tok</text>
<line x1="415.0" y1="114" x2="415.0" y2="296" stroke="#23414c" stroke-width="1"/>
<text x="415.0" y="312" fill="#7fa2ad" font-size="10.5" text-anchor="middle">300 tok</text>
<line x1="615.0" y1="114" x2="615.0" y2="296" stroke="#23414c" stroke-width="1"/>
<text x="615.0" y="312" fill="#7fa2ad" font-size="10.5" text-anchor="middle">600 tok</text>
<line x1="815.0" y1="114" x2="815.0" y2="296" stroke="#23414c" stroke-width="1"/>
<text x="815.0" y="312" fill="#7fa2ad" font-size="10.5" text-anchor="middle">900 tok</text>
<rect x="215" y="120" width="26.7" height="15" rx="2" fill="#e8b84b"/>
<rect x="241.7" y="120" width="573.3" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="131" fill="#7fa2ad" font-size="10.5" text-anchor="end">tool-call check</text>
<text x="246.7" y="131" fill="#e8b84b" font-size="9.5">40</text>
<rect x="215" y="142" width="60.0" height="15" rx="2" fill="#e8b84b"/>
<rect x="275.0" y="142" width="540.0" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="153" fill="#7fa2ad" font-size="10.5" text-anchor="end">short edit</text>
<text x="280.0" y="153" fill="#e8b84b" font-size="9.5">90</text>
<rect x="215" y="164" width="100.0" height="15" rx="2" fill="#e8b84b"/>
<rect x="315.0" y="164" width="500.0" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="175" fill="#7fa2ad" font-size="10.5" text-anchor="end">grep + read</text>
<text x="309.0" y="175" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">150</text>
<rect x="215" y="186" width="146.7" height="15" rx="2" fill="#e8b84b"/>
<rect x="361.7" y="186" width="453.3" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="197" fill="#7fa2ad" font-size="10.5" text-anchor="end">unit test run</text>
<text x="355.7" y="197" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">220</text>
<rect x="215" y="208" width="200.0" height="15" rx="2" fill="#e8b84b"/>
<rect x="415.0" y="208" width="400.0" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="219" fill="#7fa2ad" font-size="10.5" text-anchor="end">file rewrite</text>
<text x="409.0" y="219" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">300</text>
<rect x="215" y="230" width="320.0" height="15" rx="2" fill="#e8b84b"/>
<rect x="535.0" y="230" width="280.0" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="241" fill="#7fa2ad" font-size="10.5" text-anchor="end">multi-file patch</text>
<text x="529.0" y="241" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">480</text>
<rect x="215" y="252" width="433.3" height="15" rx="2" fill="#e8b84b"/>
<rect x="648.3" y="252" width="166.7" height="15" rx="2" fill="url(#hatch)"/>
<text x="205" y="263" fill="#7fa2ad" font-size="10.5" text-anchor="end">reasoning step</text>
<text x="642.3" y="263" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">650</text>
<rect x="215" y="274" width="600.0" height="15" rx="2" fill="#e8b84b"/>
<text x="205" y="285" fill="#7fa2ad" font-size="10.5" text-anchor="end">long refactor plan</text>
<text x="809.0" y="285" fill="#0e2129" font-size="9.5" text-anchor="end" font-weight="600">900</text>
<line x1="815.0" y1="114" x2="815.0" y2="296" stroke="#e2eef2" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="823.0" y="128" fill="#e2eef2" font-size="10.5">batch ends</text>
<text x="823.0" y="142" fill="#7fa2ad" font-size="10">when the last</text>
<text x="823.0" y="154" fill="#7fa2ad" font-size="10">lane finishes</text>
<rect x="215" y="321" width="12" height="12" rx="2" fill="#e8b84b"/>
<text x="233" y="331" fill="#7fa2ad" font-size="10.5">useful tokens (2,830 total)</text>
<rect x="420" y="321" width="12" height="12" rx="2" fill="url(#hatch)"/>
<text x="438" y="331" fill="#7fa2ad" font-size="10.5">wasted padding: 8x900 = 7,200 slots, 39% useful</text>
<text x="34" y="362" fill="#e2eef2" font-size="13" font-weight="600">Effective useful throughput over the whole run</text>
<line x1="215.0" y1="376" x2="215.0" y2="516" stroke="#23414c" stroke-width="1"/>
<text x="215.0" y="532" fill="#7fa2ad" font-size="10.5" text-anchor="middle">0</text>
<line x1="391.5" y1="376" x2="391.5" y2="516" stroke="#23414c" stroke-width="1"/>
<text x="391.5" y="532" fill="#7fa2ad" font-size="10.5" text-anchor="middle">100</text>
<line x1="567.9" y1="376" x2="567.9" y2="516" stroke="#23414c" stroke-width="1"/>
<text x="567.9" y="532" fill="#7fa2ad" font-size="10.5" text-anchor="middle">200</text>
<line x1="744.4" y1="376" x2="744.4" y2="516" stroke="#23414c" stroke-width="1"/>
<text x="744.4" y="532" fill="#7fa2ad" font-size="10.5" text-anchor="middle">300</text>
<text x="515" y="550" fill="#7fa2ad" font-size="10.5" text-anchor="middle">aggregate tokens per second</text>
<rect x="215" y="384" width="215.3" height="30" rx="3" fill="#ef7361"/>
<text x="225" y="403" fill="#0e2129" font-size="11.5" font-weight="600">naive static, width held at 8</text>
<text x="438.3" y="398" fill="#e2eef2" font-size="13" font-weight="700">122 tok/s</text>
<text x="438.3" y="411" fill="#7fa2ad" font-size="10">39% of the ceiling</text>
<rect x="215" y="432" width="271.8" height="30" rx="3" fill="#e0964a"/>
<text x="225" y="451" fill="#0e2129" font-size="11.5" font-weight="600">static that shrinks the batch</text>
<text x="494.8" y="446" fill="#e2eef2" font-size="13" font-weight="700">154 tok/s</text>
<text x="494.8" y="459" fill="#7fa2ad" font-size="10">still drops with each exit</text>
<rect x="215" y="480" width="548.8" height="30" rx="3" fill="#4fd0a6"/>
<text x="225" y="499" fill="#0e2129" font-size="11.5" font-weight="600">continuous batching, slots refilled</text>
<text x="771.8" y="494" fill="#e2eef2" font-size="13" font-weight="700">311 tok/s</text>
<text x="771.8" y="507" fill="#7fa2ad" font-size="10">holds batch 8, +2.5x over naive</text>
<line x1="763.8" y1="376" x2="763.8" y2="516" stroke="#4fd0a6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
</svg>