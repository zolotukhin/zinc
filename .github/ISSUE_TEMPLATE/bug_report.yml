name: Bug report
description: Report a reproducible problem in build, runtime, API, or model execution.
title: '[bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Include the hardware, backend, driver, model, and command needed to reproduce the issue. Remove credentials, private endpoints, and personal paths from logs.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command or sequence of steps.
      placeholder: |
        1. Build with `./scripts/zig.sh build`
        2. Run `./zig-out/bin/zinc ...`
        3. Observe failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the error output, log snippet, or incorrect result.
      render: shell
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, or Windows 11 with WSL2
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: Radeon AI PRO R9700, Apple M4 Max, Intel Arc B580, RTX 5090
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Vulkan
        - Metal
        - ROCm / HIP
        - CUDA (experimental)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Driver / runtime version
      description: Use the runtime for your backend; Metal users can give the macOS version.
      placeholder: Mesa / RADV version, ROCm version, NVIDIA driver / CUDA version, or macOS version
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ZINC version and build
      description: Paste zinc --version output. Include the Zig version for a source build.
      placeholder: Version, commit, target, backend, and optimization mode
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and quantization
      placeholder: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
      placeholder: ./zig-out/bin/zinc -m /path/to/model.gguf --prompt "Hello"
    validations:
      required: true

  - type: dropdown
    id: latest_main
    attributes:
      label: Reproduces on latest main?
      options:
        - 'Yes'
        - 'No'
        - 'Not checked'
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, benchmark context, related logs, or links.
