name: Tests

on:
  push:
    branches: [main]
  # CPU-only checks cover stacked PRs targeting feature branches too.
  pull_request:

jobs:
  openclaw-harness:
    name: OpenClaw protocol (2026.11.1)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.2'
      - name: Install the qualified OpenClaw dependency tree
        # Keep upstream's required bundled-plugin setup, with every npm tarball
        # integrity pinned by the lock captured during AMD qualification.
        run: npm ci --prefix tools/openclaw-client --no-audit --no-fund
      - name: Check actual OpenClaw streaming tools without a model
        run: node tools/validate_openclaw_harness.mjs --openclaw-bin "$GITHUB_WORKSPACE/tools/openclaw-client/node_modules/.bin/openclaw" --output "$RUNNER_TEMP/zinc openclaw ✓"

  opencode_clients:
    name: OpenCode protocol (${{ matrix.version }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.19.4'
            package: 'opencode-ai@1.19.4'
          - version: '2.0.21'
            package: '@opencode/cli@2.0.21'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install the tested OpenCode CLI
        # The scoped v2 package installs its platform binary in postinstall.
        env:
          OPENCODE_PACKAGE: ${{ matrix.package }}
        run: bun add --global --trust "$OPENCODE_PACKAGE"
      - name: Check actual OpenCode protocol and lifecycle without a model
        env:
          OPENCODE_EXPECT_VERSION: ${{ matrix.version }}
        run: bun tools/validate_opencode_harness.mjs --expect-version "$OPENCODE_EXPECT_VERSION" --output "$RUNNER_TEMP/zinc harness ✓"

  # Preserve the required check name while requiring both real clients.
  opencode-harness:
    needs: opencode_clients
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CLIENT_RESULT: ${{ needs.opencode_clients.result }}
        run: test "$CLIENT_RESULT" = success

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Check changed files with Bun fmt
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun fmt --check --changed="$FORMAT_BASE"

  test:
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false

      - name: Install the release shader compiler and Vulkan headers
        # Share the tested compiler with release packaging. Stock shaderc lacks
        # GL_EXT_integer_dot_product; the full SDK adds unused GUI packages and
        # makes the four CPU jobs depend on much larger downloads.
        run: bash scripts/setup_release_shaderc.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install client tooling
        run: bun install --frozen-lockfile

      - name: Run Zig Tests
        run: ./scripts/zig.sh build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Build
        run: ./scripts/zig.sh build -Doptimize=${{ matrix.optimize }} -Dinstall-hot-bench=true

      - name: Check CUDA host code without a GPU
        run: ./scripts/zig.sh build check-cuda -Doptimize=${{ matrix.optimize }}

      - name: Compile standalone tools without model or GPU execution
        run: ./scripts/zig.sh build check-tools -Doptimize=${{ matrix.optimize }}

      - name: Build ZINC_RT without GPU execution
        run: ./scripts/zig.sh build -Dbackend=zinc_rt -Dshaders=false -Doptimize=${{ matrix.optimize }} --prefix zig-out-rt

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install client tooling
        run: bun install --frozen-lockfile
      - name: Compile Metal executables and tests without GPU execution
        run: |
          for mode in Debug ReleaseSafe ReleaseFast ReleaseSmall; do
            ./scripts/zig.sh build -Doptimize="$mode"
            ./scripts/zig.sh build test-build -Doptimize="$mode"
            ./scripts/zig.sh build check-tools -Doptimize="$mode"
          done
      - name: Run CPU-only tests, including Metal benchmark CLI contracts
        run: ./scripts/zig.sh build test --summary all

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Check the pinned Nix compiler
        run: nix develop --command sh -c 'test "$(zig version)" = "$(cat .zig-version)"'
      - name: Build the Linux Nix package without GPU execution
        run: |
          nix build --print-build-logs
          ./result/bin/zinc --version
