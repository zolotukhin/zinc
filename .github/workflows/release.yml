name: Publish release
run-name: Publish candidate ${{ inputs.candidate_run }}

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 'Successful manual Release candidate run ID; review the preflight summary before approving.'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: zinc-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'zolotukhin/zinc'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.review.outputs.version }}
      commit: ${{ steps.review.outputs.commit }}
      targets: ${{ steps.review.outputs.matrix }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the exact candidate for review; require a protected environment
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 tools/release_publish.py --run "$CANDIDATE_RUN" --directory candidate

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://github.com/zolotukhin/zinc/releases
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify, create the final tag, upload and verify the same bytes, publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 tools/release_publish.py --run "$CANDIDATE_RUN" --directory candidate --publish

  post-publish:
    needs: [preflight, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    name: Public install ${{ matrix.id }} (CPU only)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Re-download public release and verify all bytes and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 tools/release_publish.py --run "$CANDIDATE_RUN" --directory candidate --public-download public-release
      - if: matrix.backend == 'vulkan'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1
      - if: matrix.backend != 'rocm'
        name: Clean install from the public archive
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGET: ${{ matrix.id }}
        run: python3 tools/release.py install-smoke --directory public-release --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
      - if: matrix.backend == 'rocm'
        name: Clean install on the supported ROCm userspace
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -i --platform linux/amd64 -v "$GITHUB_WORKSPACE:/src:ro" -e RELEASE_VERSION "$RELEASE_IMAGE" bash -seu <<'SCRIPT'
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y --no-install-recommends python3 curl ca-certificates hipblas-dev=3.2.0.70204-93~24.04 rocwmma-dev=2.2.0.70204-93~24.04
          export LD_LIBRARY_PATH=/opt/rocm/lib
          cd /tmp
          python3 /src/tools/release.py install-smoke --directory /src/public-release --version "$RELEASE_VERSION" --target linux-x86_64-rocm
          SCRIPT
