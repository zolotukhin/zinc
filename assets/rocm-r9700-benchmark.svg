<text x="40" y="640" font-size="12" fill="#5c6670">Measured 2026-09-25 · ZINC d7a5ed9bf0f8 + 547016dcebaa + 20c08b0a0c14 + c50b4add3402 + b7a35513cd94 · llama.cpp 5f436dddb · medians of repeated runs after warmup</text>
<text x="40" y="660" font-size="12" fill="#5c6670">* both engines shown without speculative decoding. Qwen 3.8 27B Dense reaches 58.2 tok/s (197%) using its NextN block; llama.cpp</text>
