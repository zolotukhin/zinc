<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="708" viewBox="0 0 1040 708" role="img" aria-labelledby="title desc">
<title id="title">ZINC compared with llama.cpp on Radeon AI PRO R9700 using ROCm</title>
<desc id="desc">For each model, two bars show ZINC's prompt-processing and token-generation speed as a percentage of a llama.cpp run on the same GPU, model file and prompt. The dashed line marks llama.cpp's own speed.</desc>
<rect width="1040" height="708" fill="#faf8f4"/>
<rect x="24" y="24" width="992" height="660" rx="18" fill="#ffffff" stroke="#e3ded4"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#1f2428">
<text x="40" y="72" font-size="27" font-weight="700">ZINC vs llama.cpp on one Radeon</text>
<text x="40" y="99" font-size="14.5" fill="#5c6670">Radeon AI PRO R9700 · ZINC on ROCm, llama.cpp on ROCm (HIP) · same GGUF, same prompt tokens, reusable servers</text>
<rect x="40.0" y="113" width="26.0" height="11" rx="3" fill="#d35400"/>
<text x="74" y="122" font-size="13" fill="#5c6670">prompt processing</text>
<rect x="208.0" y="113" width="26.0" height="11" rx="3" fill="#f0a06a"/>
<text x="242" y="122" font-size="13" fill="#5c6670">token generation</text>
