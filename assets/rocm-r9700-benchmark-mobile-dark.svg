<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1836" viewBox="0 0 420 1836" role="img" aria-labelledby="title desc">
<title id="title">ZINC vs llama.cpp · AMD Radeon AI PRO R9700 · ROCm / HIP</title>
<desc id="desc">Quick-chat medians in tokens per second; higher is faster. Orange bars are ZINC, blue bars are llama.cpp. Both engines use the same GGUF and prompt with MTP off. Each phase uses one absolute scale across all models. A badge is ZINC speed divided by llama.cpp speed, not an end-to-end speedup. Mixed measurement dates and revisions are shown per model. Qwen 3.8 27B Dense: Nov 2, 2026; ZINC 34f33b900969; llama.cpp 785322d17f2d51e5185cf996a1f4e46d87640841. Gemma 4 31B: Sep 24, 2026; ZINC d7a5ed9bf0f8; llama.cpp 5f436dddb. Qwen 3.5 9B: Sep 23, 2026; ZINC 20c08b0a0c14; llama.cpp 5f436dddb. Muse Glimmer 30B: Sep 23, 2026; ZINC 547016dcebaa; llama.cpp 5f436dddb. Gemma 4 26B-A4B MoE: Nov 3, 2026; ZINC 65363680c9e9; llama.cpp 36ee3caf7aa2dcb0210bedab1b61ee9f269765d3. Qwen 3.6 35B A3B: Sep 23, 2026; ZINC c50b4add3402; llama.cpp 5f436dddb.</desc>
